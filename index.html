document.addEventListener('click',e=>{if(e.target.closest('[data-about]')){e.preventDefault();about();}});

function routeBar(){
  return `<div class="route">${ROOMS.map(r=>{
    const acc=S.gm||S.solved[r.id]||r.id===nextRoom();
    return `<button class="stop ${S.solved[r.id]?'done':''} ${r.id===S.current?'now':''}" data-go="${r.id}" ${acc?'':'disabled'}><span class="nr">${r.id} · ${esc(r.plaats)}</span><b>${esc(r.naam)}</b>${S.solved[r.id]&&!S.gm?`<span class="st" aria-label="${sterrenVoor(r.id)} van 3 sterren">${sterTekst(sterrenVoor(r.id))}</span>`:''}</button>`;}).join('')}</div>`;
}
/* Sterren per ruimte: 3 zonder hints en fouten, 2 bij één of twee, anders 1 */
function sterrenVoor(id){const h=Object.keys(S.hintsUsed).filter(k=>k.startsWith(id+'-')).length,f=(S.foutenPer||{})[id]||0,n=h+f;return n===0?3:n<=2?2:1;}
const sterTekst=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const nextRoom=()=>{for(const r of ROOMS)if(!S.solved[r.id])return r.id;return 7;};

function room(id){
  if(S.ended)return;
  S.current=id;S.scherm='room';S.bezig=false;scherm=()=>room(S.current);bewaar();   /* een test uit een andere ruimte blokkeert niets */
  const P=PUZ[id],R=ROOMS[id-1],done=!!S.solved[id];
  app.innerHTML=`<div class="stack">${routeBar()}
  <div class="game">
    <section class="panel scene" aria-label="Werkbank">
      ${figBox(`Ruimte ${id} · ${esc(R.naam)}`,`cursus: ${esc(R.hfst)}`,P.fig(),'roomfig')}
      <div class="scene-bar"><span class="lamp ${done?'ok':'alarm'}" aria-hidden="true"></span><span class="small muted">${done?'Storing verholpen':'Storing actief'} · ${esc(R.plaats)}</span><button class="btn ghost klein" type="button" id="kaart">🗺 Kaart van de brug</button></div>
      <div class="stack bediening ${done?'hidden':''}" id="form">${P.form()}</div>
      <div id="out" aria-live="polite"></div>
      <div class="row" id="nav"></div>
    </section>
    <section class="panel stack console">
      <div class="eyebrow">Ruimte ${id} van 6 · ${esc(R.naam)}</div>
      <h2>${esc(P.titel)}</h2>
      <p>${esc(P.tekst)}</p>
      <details class="hint theory" open><summary>📘 Uit de cursus (gratis)</summary><p>${esc(P.cursus)}</p></details>
      ${P.voorwerpen?`<div class="zoek" id="zoek">${zoekHTML(id)}</div>`:''}
      ${P.dossier?`<div class="data" id="dossier">${dossierHTML(id)}</div>`:''}
      <div class="stack ${done?'hidden':''}" id="hints">${P.hints.map((h,i)=>hintHTML(`${id}-${i}`,`Hint ${i+1} (−2 min)`,h)).join('')}</div>
    </section></div></div>`;
  kleefCheck();
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>room(+b.dataset.go)));
  document.getElementById('kaart').addEventListener('click',e=>{e.stopPropagation();toonKaart(id);});
  koppelZoeken(id);
  koppelHints();
  const tr=document.getElementById('try');
  if(tr){tr.addEventListener('click',()=>attempt(id));app.querySelectorAll('#form input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')attempt(id);}));}
  if(P.init&&!done)P.init();
  window.scrollTo(0,0);
  const first=app.querySelector('#form input,#form select');if(first&&!done)first.focus({preventScroll:true});
  if(done)showSolved(id);
}

/* Hints: een betaalde hint blijft open en wordt niet opnieuw aangerekend, ook niet na vernieuwen */
function hintHTML(sleutel,titel,tekst){const u=S.hintsUsed[sleutel];return `<details class="hint" data-straf="${sleutel}"${u?' open data-used="1"':''}><summary>${titel}</summary><p>${esc(tekst)}</p></details>`;}
function koppelHints(){app.querySelectorAll('details[data-straf]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.used){d.dataset.used='1';S.hintsUsed[d.dataset.straf]=true;S.hints++;penalty(HINT_STRAF);}}));}

/* Doorzoek de ruimte: voorwerpen als knoppen; een gevonden voorwerp krijgt een vinkje */
function zoekHTML(id){
  const P=PUZ[id],lijst=S.gevonden[id]||[],alle=S.gm||S.solved[id];
  const n=P.voorwerpen.filter(v=>lijst.includes(v.id)).length;
  return `<div class="data-kop">🔍 Doorzoek de ruimte${alle?'':` · ${n} van ${P.voorwerpen.length} bekeken`}</div>
    <div class="voorwerpen">${P.voorwerpen.map(v=>{const g=lijst.includes(v.id);return `<button type="button" class="voorwerp${g?' gevonden':''}" data-vw="${v.id}"><span class="vw-icoon" aria-hidden="true">${v.icoon}</span><span class="vw-naam">${esc(v.naam)}</span>${g?'<span class="vw-ok" aria-label="bekeken">✓</span>':''}</button>`;}).join('')}</div>`;
}
function dossierHTML(id){
  const P=PUZ[id],open=P.dossier.filter((d,i)=>gevonden(id,i)).length;
  return `<div class="data-kop">Uit het dossier${open<P.dossier.length?` · ${open} van ${P.dossier.length} gegevens gevonden`:''}</div>
    <dl>${P.dossier.map((d,i)=>{const g=gevonden(id,i);return `<div class="${g?'':'onbekend'}"><dt>${d[0]}</dt><dd>${g?d[1]:'? zoek in de ruimte'}</dd></div>`;}).join('')}</dl>`;
}
function koppelZoeken(id){const z=document.getElementById('zoek');if(z)z.addEventListener('click',e=>{const b=e.target.closest('[data-vw]');if(b)openVoorwerp(id,b.dataset.vw);});}
/* Een voorwerp van dichtbij bekijken; de gegevens gaan naar het dossier en de tekening */
function openVoorwerp(id,vid){
  const v=PUZ[id].voorwerpen.find(x=>x.id===vid);if(!v||document.querySelector('.vw-ov'))return;
  const lijst=S.gevonden[id]||(S.gevonden[id]=[]),nieuw=!lijst.includes(vid);
  if(nieuw){lijst.push(vid);bewaar();geluid.vondst();}else geluid.klik();
  const o=document.createElement('div');o.className='zoom vw-ov';
  o.innerHTML=`<div class="vw-kaart" role="dialog" aria-modal="true" aria-labelledby="vw-t">
    <div class="vw-groot" aria-hidden="true">${v.icoon}</div><h3 id="vw-t">${esc(v.naam)}</h3>
    <p class="vw-tekst">${esc(v.tekst)}</p>
    <div class="small" style="color:${v.rijen.length?'var(--good)':'var(--muted)'}">${v.rijen.length?(nieuw?'✓ Toegevoegd aan het dossier':'Staat al in het dossier'):'Geen nieuwe gegevens, wel goed om te weten.'}</div>
    <div class="row"><button class="btn" data-close>Terug naar de ruimte</button></div></div>`;
  document.body.appendChild(o);
  const sluit=()=>{o.remove();document.removeEventListener('keydown',onKey);const b=document.querySelector(`[data-vw="${vid}"]`);if(b)b.focus();};
  const onKey=e=>{if(e.key==='Escape')sluit();};
  o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))sluit();});
  document.addEventListener('keydown',onKey);o.querySelector('[data-close]').focus();
  const z=document.getElementById('zoek');if(z)z.innerHTML=zoekHTML(id);
  const d=document.getElementById('dossier');if(d)d.innerHTML=dossierHTML(id);
  tekenRuimte(id);
}

/* De werkbank blijft enkel vast in beeld staan als ze volledig op het scherm past */
function kleefCheck(){const s=document.querySelector('.scene');if(!s)return;const kop=document.querySelector('header').offsetHeight;s.classList.toggle('kleeft',window.innerWidth>960&&s.offsetHeight<window.innerHeight-kop-24);}
window.addEventListener('resize',kleefCheck);
/* Kaart van de hele brug, met de huidige ruimte gemarkeerd, in het vergrootvenster */
function toonKaart(id){
  const tmp=document.createElement('div');
  tmp.innerHTML=figBox(`Kaart · je bent in ruimte ${id}: ${esc(ROOMS[id-1].naam)}`,'',elevation({hl:id}));
  openZoom(tmp.firstElementChild);
}

function attempt(id){
  if(S.ended||S.bezig)return;   /* niet opnieuw testen terwijl een test nog loopt */
  const P=PUZ[id],r=P.check();
  const out=document.getElementById('out');
  if(r.leeg||r.zacht){out.innerHTML=`<div class="msg info"><b>${r.leeg?'Nog niet volledig':'Let op'}</b>${esc(r.t)}</div>`;return;}
  if(P.na){P.na(r);S.bezig=true;setTimeout(()=>{S.bezig=false;},P.naDuur||800);}
  if(r.ok){S.solved[id]=true;S.nieuw=id;geluid.goed();bewaar();hud();showSolved(id);setTimeout(()=>toonOpgelost(id),(P.naDuur||600)+400);return;}
  S.fouten++;S.foutenPer[id]=(S.foutenPer[id]||0)+1;geluid.fout();penalty(FOUT_STRAF);
  out.innerHTML=`<div class="msg no"><b>Fout, −1 minuut</b>${esc(r.t)}</div>`;
  const f=document.getElementById('form');f.classList.remove('wiebel');void f.offsetWidth;f.classList.add('wiebel');
  kleefCheck();
}
/* Beloningsmoment: kaart met de gewonnen letter en de uitleg, Enter gaat meteen verder */
function toonOpgelost(id){
  if(S.ended||S.current!==id||document.querySelector('.solved-ov'))return;
  const n=nextRoom(),verder=n<=6?`Verder naar ruimte ${n}: ${esc(ROOMS[n-1].naam)} →`:'Terug naar het brugwachtershuis →';
  const o=document.createElement('div');o.className='zoom solved-ov';
  o.innerHTML=`<div class="solved-card" role="dialog" aria-modal="true" aria-labelledby="sv-t">
    <div class="eyebrow" style="color:var(--good)">Storing verholpen · ruimte ${id} van 6</div>
    <div class="sv-top"><div class="big-letter" aria-label="Letter ${letterVan(id)}">${letterVan(id)}</div>
      <div><h2 id="sv-t">${esc(ROOMS[id-1].naam)}</h2>${S.gm?'':`<div class="sterren" aria-label="${sterrenVoor(id)} van 3 sterren">${sterTekst(sterrenVoor(id))}</div>`}<p class="small muted">Nieuwe letter voor het wachtwoord. ${Object.keys(S.solved).length} van de 6 storingen opgelost.${S.gm?'':sterrenVoor(id)===3?' Zonder hints of fouten!':' Drie sterren krijg je zonder hints en zonder fouten.'}</p></div></div>
    <p>${esc(PUZ[id].uitleg)}</p>
    <div class="row"><button class="btn" data-next>${verder}</button><button class="btn ghost" data-stay>Blijf in deze ruimte</button></div>
  </div>`;
  document.body.appendChild(o);
  const sluit=()=>{o.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')sluit();};
  o.querySelector('[data-next]').addEventListener('click',()=>{sluit();n<=6?room(n):finale();});
  o.querySelector('[data-stay]').addEventListener('click',sluit);
  document.addEventListener('keydown',onKey);
  o.querySelector('[data-next]').focus();
}
function showSolved(id){
  document.getElementById('form').classList.add('hidden');
  document.getElementById('hints').classList.add('hidden');
  document.getElementById('out').innerHTML=`<div class="msg ok"><b>Opgelost · letter: ${letterVan(id)}</b>${esc(PUZ[id].uitleg)}</div>`;
  const rf=document.querySelector('#roomfig .fig-svg');if(rf)rf.innerHTML=PUZ[id].fig();
  const lamp=document.querySelector('.scene-bar .lamp');if(lamp){lamp.className='lamp ok';lamp.nextElementSibling.textContent=`Storing verholpen · ${ROOMS[id-1].plaats}`;}
  setTimeout(kleefCheck,0);
  const n=nextRoom(),nav=document.getElementById('nav');
  nav.innerHTML=n<=6?`<button class="btn" id="nx">Verder naar ruimte ${n}: ${esc(ROOMS[n-1].naam)} →</button>`:`<button class="btn" id="nx">Terug naar het brugwachtershuis →</button>`;
  document.getElementById('nx').addEventListener('click',()=>n<=6?room(n):finale());
  document.querySelectorAll('.stop').forEach(b=>{const r=+b.dataset.go;b.classList.toggle('done',!!S.solved[r]);b.disabled=!(S.gm||S.solved[r]||r===nextRoom());});
}

function finale(){
  if(S.ended)return;
  scherm=finale;S.scherm='finale';bewaar();
  const got=S.letters;
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Brugwachtershuis · laatste stap</div>
    <h2>Het systeem vraagt het wachtwoord</h2>
    <p>Alle storingen zijn opgelost. Op het scherm verschijnt: <b>"Geef het principe waarop elke beweegbare brug steunt."</b> De zes letters die jullie verzamelden staan door elkaar: <b style="font-family:var(--mono);letter-spacing:.2em">${got.join(' ')}</b></p>
    <div class="lock"><input class="word" id="word" maxlength="6" placeholder="······" aria-label="Wachtwoord"><button class="btn" id="open">Open de brug</button></div>
    <div id="out" aria-live="polite"></div>
    ${hintHTML('finale','Hint (−2 min)','Ballastkist, contragewicht, sluitend moment: het gaat altijd om …')}
    ${figBox('Langsdoorsnede','',elevation())}
  </section>`;
  koppelHints();
  window.scrollTo(0,0);
  const w=document.getElementById('word');w.focus({preventScroll:true});
  const go=()=>{if(S.ended)return;
    const v=w.value.trim().toUpperCase();
    if(!v){document.getElementById('out').innerHTML=`<div class="msg info"><b>Nog niet volledig</b>Typ eerst een wachtwoord van zes letters.</div>`;return;}
    if(v===FINAL_WORD){geluid.goed();systeemcontrole();}
    else{S.fouten++;geluid.fout();penalty(FOUT_STRAF);document.getElementById('out').innerHTML=`<div class="msg no"><b>Toegang geweigerd, −1 minuut</b>Herschik de zes letters.</div>`;}};
  document.getElementById('open').addEventListener('click',go);w.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

/* Finale, stap 2: metapuzzel. Het paneel vraagt waarden die je krijgt door de uitkomsten van de ruimtes te combineren. */
const META=[
  {id:'ballast',kamer:2,label:'Ballast in de kist',eenheid:'kN',juist:v=>Math.abs(v-3900)<1,
    fout:v=>Math.abs(v-78)<0.5?'Dat is het aantal blokken. Het paneel vraagt het gewicht van de ballast.':Math.abs(v-3932)<1?'Dat is het exacte evenwicht. In de kist liggen hele blokken.':'Hoeveel blokken liggen er in de kist, en hoeveel weegt één blok?'},
  {id:'vijzel',kamer:3,label:'Kracht per vijzel',eenheid:'kN',juist:v=>Math.abs(v-250)<0.5,
    fout:v=>Math.abs(v-500)<0.5?'Dat is de kracht van beide vijzels samen.':'Welke kracht stelden jullie in de machinekamer in?'},
  {id:'oplegging',kamer:5,label:'Remkracht per vaste oplegging (A of B, gelijk verdeeld)',eenheid:'kN',juist:v=>Math.abs(v-234)<0.5,
    fout:v=>Math.abs(v-468)<0.5?'Dat is de totale remkracht. Welke opleggingen houden de brug in de langsrichting vast?':'Combineer de remkracht uit ruimte 5 met het oplegschema uit ruimte 4.'},
  {id:'voeg',kamer:6,label:'Uitzetting aan de voeg op een zomerdag (+54 °C)',eenheid:'mm',juist:v=>v>=21&&v<=21.2,
    fout:v=>(v>=34&&v<=35)?'Dat is de totale beweging, warm én koud samen. Het paneel vraagt enkel het uitzetten.':Math.round(v)===13?'Dat is het krimpen op een winternacht.':'ΔL+ = α · L · (54 − 10).'}
];
function systeemcontrole(){
  if(S.ended)return;
  scherm=finale;S.meta=S.meta||{};bewaar();
  const notities=ROOMS.filter(r=>S.solved[r.id]).map(r=>`<li><b>Ruimte ${r.id} · ${esc(r.naam)}:</b> ${esc(PUZ[r.id].uitleg)}</li>`).join('');
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Brugwachtershuis · systeemcontrole</div>
    <h2>Klopt de hele brug samen?</h2>
    <p>Het wachtwoord klopt. Voor de brug open mag, controleert het systeem of alle onderdelen samen kloppen. Combineer wat jullie in de ruimtes ontdekten: niet alles staat letterlijk in je notities. Een controle met een fout kost 1 minuut.</p>
    <div class="meta">${META.map(m=>{const ok=S.meta[m.id];return `<div class="meta-rij${ok?' ok':''}" id="mr-${m.id}"><span class="plamp" aria-hidden="true"></span>
      <label for="m-${m.id}"><small>Ruimte ${m.kamer} · ${esc(ROOMS[m.kamer-1].naam)}</small>${esc(m.label)}</label>
      <div class="lock"><input id="m-${m.id}" inputmode="decimal" maxlength="7" placeholder="${m.eenheid}"${ok?' disabled value="✓"':''} aria-label="${esc(m.label)} in ${m.eenheid}"><span class="eenheid">${m.eenheid}</span></div>
      <div class="meta-msg" id="mm-${m.id}" aria-live="polite">${ok?'✓ klopt':''}</div></div>`;}).join('')}</div>
    <button class="btn" id="check">Controleer het systeem</button>
    <div id="out" aria-live="polite"></div>
    <details class="hint theory"><summary>📒 Jullie notities uit de ruimtes (gratis)</summary><ul class="plain">${notities}</ul></details>
    ${hintHTML('meta','Hint (−2 min)','Ballast: aantal blokken × 50 kN. Remkracht: A en B houden de brug samen in de langsrichting vast en delen de remkracht. Voeg: enkel het uitzetten, ΔL+ = α · L · (54 − 10).')}
    ${figBox('Langsdoorsnede','',elevation())}
  </section>`;
  koppelHints();window.scrollTo(0,0);
  const out=document.getElementById('out');
  const controleer=()=>{
    if(S.ended)return;
    const open=META.filter(m=>!S.meta[m.id]);
    if(open.some(m=>isNaN(num('m-'+m.id)))){out.innerHTML=`<div class="msg info"><b>Nog niet volledig</b>Vul eerst alle velden in.</div>`;return;}
    let fouten=0;
    open.forEach(m=>{const v=num('m-'+m.id),rij=document.getElementById('mr-'+m.id),msg=document.getElementById('mm-'+m.id);
      if(m.juist(v)){S.meta[m.id]=true;rij.className='meta-rij ok';msg.textContent='✓ klopt';const i=document.getElementById('m-'+m.id);i.disabled=true;}
      else{fouten++;rij.className='meta-rij fout';msg.textContent='✗ '+m.fout(v);}});
    bewaar();
    if(fouten){S.fouten++;geluid.fout();penalty(FOUT_STRAF);out.innerHTML=`<div class="msg no"><b>Systeemfout, −1 minuut</b>${fouten} ${fouten===1?'waarde klopt':'waarden kloppen'} nog niet.</div>`;}
    else{geluid.goed();out.innerHTML=`<div class="msg ok"><b>Alle systemen in orde</b>Het bedieningspaneel wordt vrijgegeven.</div>`;setTimeout(procedure,1100);}
  };
  document.getElementById('check').addEventListener('click',controleer);
  app.querySelectorAll('.meta input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')controleer();}));
  if(META.every(m=>S.meta[m.id])){setTimeout(procedure,300);return;}
  const eerste=app.querySelector('.meta input:not([disabled])');if(eerste)eerste.focus({preventScroll:true});
}

/* Finale, stap 3: de openingsprocedure aan het bedieningspaneel, in de juiste volgorde (de klok loopt door) */
const PROC=[
  {id:'slag',t:'Slagbomen sluiten',i:'🚧',ok:'Verkeerslichten op rood, slagbomen dicht. Er rijdt niemand meer op de brug.'},
  {id:'vergr',t:'Vergrendeling losmaken',i:'🔓',ok:'De neus van het beweegbare brugdek is ontgrendeld.'},
  {id:'vijzel',t:'Vijzels starten',i:'⚙️',ok:'De vijzels trekken de staartligger omlaag: het brugdek komt omhoog.'}
];
function procedure(){
  if(S.ended)return;
  let stap=0;
  const volgorde=PROC.slice().sort(()=>Math.random()-.5);
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Brugwachtershuis · bedieningspaneel ontgrendeld</div>
    <h2>Voer de openingsprocedure uit</h2>
    <p>Het wachtwoord klopt en het paneel licht op. Druk de drie knoppen in de juiste volgorde. Denk aan wie er nog op de brug rijdt, en aan wat het brugdek op zijn plaats houdt.</p>
    <div class="paneel">${volgorde.map(p=>`<button type="button" class="pknop" data-p="${p.id}"><span class="plamp" aria-hidden="true"></span><span class="pi" aria-hidden="true">${p.i}</span><span>${p.t}</span></button>`).join('')}</div>
    <div id="out" aria-live="polite"></div>
    ${figBox('Langsdoorsnede','',elevation(),'procfig')}
  </section>`;
  window.scrollTo(0,0);
  const out=document.getElementById('out');
  const reset=()=>{stap=0;app.querySelectorAll('.pknop').forEach(b=>b.classList.remove('aan'));};
  app.querySelectorAll('.pknop').forEach(b=>b.addEventListener('click',()=>{
    if(S.ended||stap>=PROC.length)return;
    const p=PROC[stap];
    if(b.dataset.p===p.id){
      b.classList.add('aan');geluid.klik();stap++;
      out.innerHTML=`<div class="msg ok"><b>Stap ${stap} van 3</b>${esc(p.ok)}</div>`;
      if(stap===PROC.length)setTimeout(win,900);
    }else{
      geluid.fout();
      const waarom=stap===0?'Eerst het verkeer tegenhouden: er rijden nog wagens over de brug!':b.dataset.p==='vijzel'?'De vergrendeling zit nog vast: de vijzels slaan af.':'Dat kan nu niet in deze volgorde.';
      out.innerHTML=`<div class="msg no"><b>Noodstop: de procedure begint opnieuw</b>${esc(waarom)}</div>`;
      reset();
    }
  }));
  app.querySelector('.pknop').focus();
}

/* Rang en prestaties op het eindscherm, plus het record in deze browser */
function totaalSterren(){return ROOMS.reduce((s,r)=>s+(S.solved[r.id]?sterrenVoor(r.id):0),0);}
function rang(st,t){
  if(st>=16&&t<30*60)return ['Hoofdingenieur bruggen','Bijna zonder hulp en ruim op tijd: de haven is in goede handen.'];
  if(st>=12)return ['Bruggenbouwer','Stevig werk met weinig hulp.'];
  if(st>=8)return ['Ingenieur van wacht','De brug is open, al was het hier en daar zoeken.'];
  return ['Stagiair-brugwachter','Gehaald! Bekijk de uitleg hieronder: de volgende keer gaat het sneller.'];
}
function prestaties(t){
  const f=S.foutenPer||{},p=[];
  if(S.fouten===0)p.push(['🎯','Foutloos','geen enkel fout antwoord']);
  if(S.hints===0)p.push(['🧠','Zonder hints','alles zelf uitgerekend']);
  if(t<30*60)p.push(['⚡','Snelle ingenieur','binnen 30 minuten']);
  if(!f[2])p.push(['⚖️','Balanskunstenaar','ballastkist in één keer juist']);
  if(!f[3])p.push(['🌬️','Windbreker','proefopening in één keer geslaagd']);
  if(!f[4])p.push(['🔩','Opleggingsexpert','opleggingen in één keer juist']);
  if(!f[6])p.push(['🌡️','Voegspecialist','voeg in één keer juist']);
  return p;
}
function record(st,t){
  const K=OPSLAG+'-record';let oud=null;try{oud=JSON.parse(localStorage.getItem(K)||'null');}catch(e){}
  const beter=!oud||st>oud.sterren||(st===oud.sterren&&t<oud.tijd);
  if(beter){try{localStorage.setItem(K,JSON.stringify({sterren:st,tijd:Math.round(t)}));}catch(e){}}
  return {beter,oud};
}

function debrief(titel){
  return `<div class="stack"><h3>${titel}</h3>${ROOMS.map(r=>`<details class="hint"><summary>${S.solved[r.id]?'✓':'○'} Ruimte ${r.id} · ${esc(r.naam)}${S.solved[r.id]&&!S.gm?` <span class="st">${sterTekst(sterrenVoor(r.id))}</span>`:''} <span class="muted small">· ${esc(r.hfst)}</span></summary><p><b>${esc(PUZ[r.id].kern)}</b></p><p>${esc(PUZ[r.id].uitleg)}</p></details>`).join('')}
    <p class="small"><a href="#over" data-about>Over dit spel: leerdoelen en bronnen →</a></p></div>`;
}

function animateOpen(el){
  if(!el)return;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){el.innerHTML=elevation({open:75});return;}
  let a=0;const step=()=>{a+=1.5;if(!el.isConnected)return;el.innerHTML=elevation({open:Math.min(75,a)});if(a<75)requestAnimationFrame(step);};step();
}

function win(){
  S.ended='win';clearInterval(tick);hud();scherm=win;wis();
  if(!S.eindGeluid){S.eindGeluid=true;geluid.open();setTimeout(()=>geluid.hoorn(0.5),1400);}
  const t=used(),st=totaalSterren();
  if(S.eindScore==null&&!S.gm)S.eindScore=record(st,t);   /* record maar één keer vergelijken */
  const [titel,zin]=rang(st,t),rec=S.eindScore;
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Brugwachtershuis · ${klok(START_KLOK+t)}</div>
    <h1>De brug gaat open. De MV Schelde Trader vaart door.</h1>
    ${S.gm?'<p class="muted">Spelleidermodus: geen score.</p>':`<div class="rang"><div class="rang-titel">${esc(titel)}</div><div class="sterren groot" aria-label="${st} van 18 sterren">★ ${st} / 18</div><p>${esc(zin)}</p>
      ${rec&&rec.beter?'<div class="badge-rec">🏆 Nieuw record in deze browser!</div>':rec&&rec.oud?`<div class="small muted">Record in deze browser: ★ ${rec.oud.sterren} in ${fmt(rec.oud.tijd)}</div>`:''}</div>`}
    <div class="row" style="gap:28px">
      <div><div class="big good">${S.gm?'—':fmt(t)}</div><div class="muted">gebruikte tijd incl. straf</div></div>
      <div><div class="big" style="color:var(--amber)">${S.hints}</div><div class="muted">hints</div></div>
      <div><div class="big" style="color:var(--amber)">${S.fouten}</div><div class="muted">fouten</div></div>
    </div>
    ${S.gm?'':`<div class="prestaties">${prestaties(t).map(([i,n,u])=>`<div class="prestatie"><span aria-hidden="true">${i}</span><div><b>${n}</b><small>${u}</small></div></div>`).join('')||'<p class="small muted">Nog geen prestaties: probeer het opnieuw zonder hints of fouten.</p>'}</div>`}
    <div class="radio">📻 "Vaartdokbrug, hier de Schelde Trader. Mooi werk, ingenieurs. Over en sluiten."</div>
    ${figBox('Langsdoorsnede · beweegbaar brugdek open (75°)','licht sluitend moment · vijzels 2 × 250 kN','','elevfig')}
    <div class="fig"><div class="cap"><span>Bovenaanzicht · de Schelde Trader vaart door</span><span></span></div><svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" id="doorvaart" role="img" aria-label="Het schip vaart door de geopende brug"></svg></div>
    ${debrief('Wat hebben jullie toegepast?')}
    <div class="row"><button class="btn" id="again">Opnieuw spelen</button></div>
  </section>`;
  window.scrollTo(0,0);
  animateOpen(document.querySelector('#elevfig .fig-svg'));
  /* bovenaanzicht: eerst gaat het brugdek open, daarna vaart het schip er doorheen */
  const dv=document.getElementById('doorvaart');
  animeer(1300,p=>{if(dv.isConnected)dv.innerHTML=plan({shipY:300,open:75*zacht(p)});},
    ()=>animeer(3200,p=>{if(dv.isConnected)dv.innerHTML=plan({shipY:300-460*p,open:75});}));
  document.getElementById('again').addEventListener('click',()=>location.reload());
}

function gameOver(){
  S.ended='lose';clearInterval(tick);hud();scherm=gameOver;wis();
  if(!S.eindGeluid){S.eindGeluid=true;geluid.hoorn(1);setTimeout(()=>geluid.fout(),2600);}
  const n=Object.keys(S.solved).length;
  app.innerHTML=`<section class="panel stack shake" id="go-panel">
    <div class="eyebrow" style="color:var(--bad)">${klok(START_KLOK+TOTAL)} · aanvaring</div>
    <div class="big bad">GAME OVER</div>
    <h2>De MV Schelde Trader ramt het gesloten brugdek.</h2>
    <p>De tijd was op. Het schip kon niet meer stoppen en voer tegen de Vaartdokbrug. Jullie losten ${n} van de 6 ruimtes op. Hieronder staan de oplossing en de uitleg van elke ruimte.</p>
    <div class="fig"><div class="cap"><span>Bovenaanzicht · het schip nadert</span><span style="color:var(--bad)" id="crash-cap"></span></div><svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" id="crash"></svg></div>
    ${debrief('Bekijk de oplossingen')}
    <div class="row"><button class="btn" id="again">Probeer opnieuw</button></div>
  </section>`;
  window.scrollTo(0,0);
  document.getElementById('again').addEventListener('click',()=>location.reload());
  const svg=document.getElementById('crash'),panel=document.getElementById('go-panel');panel.classList.remove('shake');
  const rays=`<g stroke="#f2a33a" stroke-width="4">${Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<line x1="${405+Math.cos(a)*20}" y1="${170+Math.sin(a)*20}" x2="${405+Math.cos(a)*45}" y2="${170+Math.sin(a)*45}"/>`;}).join('')}</g>`;
  const end=()=>{if(!svg.isConnected)return;svg.innerHTML=plan({shipY:176,crash:true})+rays;document.getElementById('crash-cap').textContent='aanvaring';void panel.offsetWidth;panel.classList.add('shake');};
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){end();return;}
  const t0=performance.now(),dur=2600;
  const step=now=>{if(!svg.isConnected)return;const p=Math.min(1,(now-t0)/dur);svg.innerHTML=plan({shipY:330-p*(330-176)});if(p<1)requestAnimationFrame(step);else end();};
  requestAnimationFrame(step);
}

document.getElementById('foot').innerHTML=`Fictieve brug met realistische, vereenvoudigde waarden · ${VERSIE} · <a href="#over" data-about>Over dit spel</a>`;
/* Hoogte van de vaste kop doorgeven aan de CSS, zodat de tekening er net onder blijft staan */
(()=>{const kop=document.querySelector('header');const zet=()=>document.documentElement.style.setProperty('--kop',kop.offsetHeight+'px');zet();if(window.ResizeObserver)new ResizeObserver(zet).observe(kop);else window.addEventListener('resize',zet);})();
intro();hud();
</script>
</body>
