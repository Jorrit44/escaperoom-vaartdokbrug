<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape room Vaartdokbrug</title>
<meta name="description" content="Escape room voor het vak Bruggenbouw: open de beweegbare Vaartdokbrug voor het schip ertegen vaart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Controlekamer bij nacht: donker staalblauw, amberkleurige displays; groen = opgelost, rood = alarm */
  --bg:#0f1b26;
  --panel:#162534;
  --ink:#e6edf2;
  --muted:#93a4b3;
  --line:#2a3d4f;
  --amber:#f2a33a;
  --good:#4cc38a;
  --bad:#ef6b5b;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100vh}
button,select,input{font:inherit}
button{cursor:pointer}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px}
/* De kop met klok blijft bovenaan staan, ook als je naar beneden scrolt */
header{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.disp{font-family:var(--mono);font-weight:600;font-size:20px;color:var(--amber);background:#0a131b;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
.disp.warn{color:var(--bad)}
.disp small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.letters{display:flex;gap:4px;align-items:center}
.letters span{width:30px;height:38px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:20px;background:#0a131b;border:1px solid var(--line);border-radius:5px;color:var(--good)}
.radar{background:#0a131b;border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:190px;display:flex;flex-direction:column;gap:2px}
.radar small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-align:center;font-weight:500}
.radar svg{display:block;width:100%;height:auto;border-radius:3px}
@media (max-width:860px){
  header{grid-template-columns:1fr;padding:8px 0;gap:6px}
  .brand{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:none}
  .radar{display:none}
  .hud{gap:6px;flex-wrap:nowrap}
  .disp{font-size:16px;min-width:0;flex:1 1 0;padding:3px 6px}
  .letters{gap:3px}
  .letters span{width:22px;height:34px;font-size:15px}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(30px,5vw,50px);font-weight:900;letter-spacing:-.02em}
h2{font-size:25px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{background:var(--amber);color:#1b1205;border:0;border-radius:6px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.radio{font-family:var(--mono);font-size:15px;background:#0a131b;border-left:3px solid var(--amber);padding:12px 14px;border-radius:0 6px 6px 0;color:#f6d7a8}
.fig{background:#0d1822;border:1px solid var(--line);border-radius:8px;padding:8px}
.fig svg{display:block;width:100%;height:auto}
.fig.zoomable{cursor:zoom-in}
.fig.zoomable:hover{border-color:#3d566d}
.cap{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 4px 8px}
.zoom{position:fixed;inset:0;z-index:100;background:rgba(4,9,14,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.zoom-in{background:#0d1822;border:1px solid var(--line);border-radius:10px;padding:10px;width:min(1500px,100%);max-height:100%;overflow:auto}
.zoom-in svg{display:block;width:100%;height:auto;min-width:860px}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;left:0;margin-bottom:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.dossier{width:100%;border-collapse:collapse;font-size:15px}
table.dossier th,table.dossier td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.dossier th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table.dossier td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;max-width:55%}
.game{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.game{grid-template-columns:1fr}}
.lock{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.lock input{font-family:var(--mono);font-size:26px;font-weight:600;width:140px;text-align:center;background:#0a131b;color:var(--amber);border:1px solid var(--line);border-radius:6px;padding:6px}
.lock input.word{width:220px;text-transform:uppercase;letter-spacing:.2em}
select{background:#0a131b;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.grid18{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.grid18 .h{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);line-height:1.3;align-self:end}
.grid18 .h small,.grid18 .ax small,.vb small{display:block;font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.grid18 .ax{font-family:var(--mono);font-size:14px;color:var(--amber);line-height:1.2}
.vb{border:1px dashed var(--line);border-radius:6px;padding:5px 10px;color:var(--ink);background:#0a131b;line-height:1.3}
.step{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border-top:1px solid var(--line);padding-top:12px}
.msg{border-left:4px solid var(--line);background:#0f1d2a;padding:10px 12px;border-radius:0 6px 6px 0}
.msg.ok{border-color:var(--good)}
.msg.no{border-color:var(--bad)}
.msg.info{border-color:var(--amber)}
.msg b{display:block}
details.hint{background:#0f1d2a;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
details.hint summary{cursor:pointer;font-weight:600}
details.hint p{margin-top:6px}
details.theory{background:#11241b;border-color:#2f5a43}
details.theory summary{color:var(--good)}
.route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stop{background:#0f1d2a;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--ink);min-width:0;overflow-wrap:anywhere;hyphens:auto}
.stop .nr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stop b{font-size:15px}
.stop.now{border-color:var(--amber)}
.stop.done{border-color:var(--good)}
.stop:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:760px){.route{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stop{padding:7px}.stop b{font-size:13px;line-height:1.3}.stop .nr{font-size:11px}}
.big{font-family:var(--display);font-weight:900;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
.big.good{color:var(--good)}
.big.bad{color:var(--bad)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:5px 0;max-width:76ch}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--amber);color:var(--amber)}
footer{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.shake{animation:shake .5s 3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Escape room · De Vaartdokbrug zit vast<small>BRUGGENBOUW · HOOFDSTUKKEN III, XVIII, XXIV EN XXV · FICTIEVE BRUG, REALISTISCHE WAARDEN</small></div>
    <div class="hud" id="hud">
      <div class="disp" id="clock"><small>TIJD</small>--:--</div>
      <div class="disp" id="pen"><small>STRAF</small>+00:00</div>
      <div class="letters" id="letters" aria-label="Verzamelde letters"></div>
      <div class="radar"><small>SCHIP NADERT</small><svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" id="radar" role="img" aria-label="Bovenaanzicht: het schip nadert de brug"></svg></div>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>

<script>
/* =====================================================================
   INSTELLINGEN — hier pas je het spel aan
   ===================================================================== */
const VERSIE='v11';
const GROEP={nr:'XX',leden:[]};      // TODO groep: vul het groepsnummer en de namen in, bv. {nr:'07',leden:['Naam 1','Naam 2','Naam 3','Naam 4']}
const TOTAL=45*60;                     // speeltijd in seconden (v10: 30 min, na speltest verhoogd)
const START_KLOK=5*3600+58*60;         // verhaalklok bij de start: 05:58
const HINT_STRAF=120, FOUT_STRAF=60;   // in seconden

/* =====================================================================
   DE FICTIEVE BRUG
   ===================================================================== */
const BRUG=[
  ['Beweegbaar brugdek (draaischarnier tot punt)','30,0 m'],
  ['Vrije doorvaartbreedte','25,0 m'],
  ['Vaste overspanning (pijler tot noordelijk landhoofd)','40,0 m'],
  ['Breedte brugdek: 2 rijstroken van 3,0 m + 2 fietspaden','11,0 m'],
  ['Beweegbaar brugdek','orthotrope rijvloer (staal)'],
  ['Staartligger (draaischarnier tot ballastkist)','6,5 m'],
  ['Openingshoek beweegbaar brugdek','75°'],
  ['Aandrijving: hydraulische vijzels (één per hoofdligger)','2']
];

/* =====================================================================
   RUIMTES — vaste volgorde, van zuid naar noord over de brug
   ===================================================================== */
const ROOMS=[
  {id:1,naam:'Brugwachtershuis',plaats:'zuidoever',hfst:'XVIII §1 · p. 208',letter:'L'},
  {id:2,naam:'Kelder: ballastkist',plaats:'onder de zuidoever',hfst:'XVIII §3.1–3.2 · p. 210–211',letter:'A'},
  {id:3,naam:'Machinekamer: vijzels',plaats:'kelder',hfst:'XVIII §3.1–3.2 · p. 210–211',letter:'S'},
  {id:4,naam:'Pijler: opleggingen',plaats:'noordkant van de doorvaart',hfst:'XXIV §2 en §6 · p. 259–265',letter:'B'},
  {id:5,naam:'Vaste overspanning: remkracht',plaats:'op het brugdek',hfst:'III §1.3 · p. 24–25',letter:'N'},
  {id:6,naam:'Noordlandhoofd: brugdekvoeg',plaats:'noordoever',hfst:'III §4.1.1 en XXV · p. 39–40, 272–274',letter:'A'}
];
const FINAL_WORD='BALANS';

/* =====================================================================
   STAAT, KLOK EN HULPFUNCTIES
   ===================================================================== */
const S={start:null,penalty:0,running:false,solved:{},hints:0,fouten:0,current:1,ended:false,gm:false};
const app=document.getElementById('app');
let tick=null;
let scherm=()=>intro();   // het scherm waar "Terug" naartoe gaat
const fmt=s=>{const n=s<0;s=Math.abs(Math.round(s));return (n?'-':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const klok=s=>{s=Math.round(s);return String(Math.floor(s/3600)%24).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0');};
const MINWOORD={15:'vijftien',20:'twintig',25:'vijfentwintig',30:'dertig',35:'vijfendertig',40:'veertig',45:'vijfenveertig',50:'vijftig',60:'zestig'};
const minuten=n=>MINWOORD[n]||String(n);
const used=()=>S.start?(Date.now()-S.start)/1000+S.penalty:S.penalty;
const left=()=>TOTAL-used();
function num(id){const el=document.getElementById(id);if(!el)return NaN;const t=el.value.trim().replace(/\s/g,'').replace(',','.');return t===''?NaN:Number(t);}
function hud(){
  const l=left();const c=document.getElementById('clock');
  c.innerHTML=`<small>${S.gm?'SPELLEIDER':'TIJD'}</small>${S.gm?'—':fmt(Math.max(0,l))}`;c.classList.toggle('warn',!S.gm&&S.running&&l<300);
  document.getElementById('pen').innerHTML=`<small>STRAF</small>+${fmt(S.penalty)}`;
  document.getElementById('letters').innerHTML=ROOMS.map(r=>`<span>${S.solved[r.id]?r.letter:''}</span>`).join('');
  radar();
  if(S.running&&!S.gm&&!S.ended&&l<=0)gameOver();
}
function startClock(){if(S.running)return;S.start=Date.now();S.running=true;tick=setInterval(hud,500);hud();}
function penalty(s){if(S.gm)return;S.penalty+=s;hud();}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* Tekening in een kader; klikken vergroot ze */
function figBox(links,rechts,svg,id){
  return `<div class="fig zoomable" tabindex="0" role="button" aria-label="Tekening vergroten"${id?` id="${id}"`:''}><div class="cap"><span>${links}</span><span>${rechts?rechts+' · ':''}⤢ vergroot</span></div><div class="fig-svg">${svg}</div></div>`;
}
function openZoom(f){
  const svg=f.querySelector('svg');if(!svg)return;
  const cap=f.querySelector('.cap span');
  const o=document.createElement('div');o.className='zoom';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.innerHTML=`<div class="zoom-in"><div class="zoom-bar"><span>${cap?esc(cap.textContent):''}</span><button class="btn ghost" data-close>Sluiten ✕</button></div>${svg.outerHTML}</div>`;
  document.body.appendChild(o);
  const close=()=>{o.remove();document.removeEventListener('keydown',onKey);if(f.isConnected)f.focus();};
  const onKey=e=>{if(e.key==='Escape')close();};
  o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))close();});
  document.addEventListener('keydown',onKey);
  o.querySelector('[data-close]').focus();
}
document.addEventListener('click',e=>{const f=e.target.closest('.fig.zoomable');if(f)openZoom(f);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('zoomable')){e.preventDefault();openZoom(e.target);}});

/* =====================================================================
   TEKENINGEN
   ===================================================================== */
const MONO='font-family="IBM Plex Mono,monospace"';
/* Langsdoorsnede, schaal 9 px per meter. Draaischarnier op x=270. */
function elevation(o){
  o=o||{};const hl=o.hl||0,open=o.open||0;
  const top=open>0?-100:0;                       /* open brugdek steekt hoger uit */
  const a=open*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const rot=(x,y)=>[270+x*c+y*s,190-x*s+y*c];    /* punt op de staartligger, meegedraaid */
  const [jx,jy]=rot(-27,6);                      /* aangrijpingspunt vijzel: t = 3,0 m */
  const tag=(n,x,y)=>{const done=S.solved[n],here=hl===n;return `<g><circle cx="${x}" cy="${y}" r="13" fill="${done?'#4cc38a':here?'#f2a33a':'#0a131b'}" stroke="#f2a33a" stroke-width="${here?4:2}"/><text x="${x}" y="${y+5}" ${MONO} font-size="14" font-weight="600" text-anchor="middle" fill="${done||here?'#0a131b':'#f2a33a'}">${n}</text></g>`;};
  return `<svg viewBox="0 ${top} 1000 ${340-top}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Langsdoorsnede van de fictieve Vaartdokbrug">
  <rect y="${top}" width="1000" height="${340-top}" fill="#0d1822"/>
  <rect x="280" y="232" width="250" height="108" fill="#173a52"/>
  ${Array.from({length:6},(_,i)=>`<path d="M${296+i*38} ${250+(i%2)*16} q10 -5 20 0" stroke="#2f6b8f" fill="none" stroke-width="1.5"/>`).join('')}
  <polygon points="0,200 150,200 150,340 0,340" fill="#3a4b5b"/>
  <polygon points="150,200 280,200 280,340 150,340" fill="#2c3b49"/>
  <rect x="164" y="202" width="110" height="124" fill="#0d1822" stroke="#3a4b5b" stroke-width="2"/>
  <rect x="0" y="182" width="270" height="16" fill="#7d93a8"/>
  <g><rect x="40" y="120" width="78" height="62" fill="#22384c" stroke="#5d7286"/><polygon points="34,122 79,96 124,122" fill="#2c4459" stroke="#5d7286"/><rect x="54" y="136" width="50" height="20" fill="#f2a33a" opacity=".8"/></g>
  <rect x="224" y="318" width="16" height="7" fill="#55687a"/>
  <line x1="232" y1="320" x2="${jx.toFixed(1)}" y2="${jy.toFixed(1)}" stroke="#c9d4dd" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(${-open} 270 190)">
    <rect x="270" y="180" width="270" height="18" fill="#9fb3c6" stroke="#0a131b"/>
    <rect x="211.5" y="184" width="58.5" height="12" fill="#9fb3c6" stroke="#0a131b"/>
    <rect x="194" y="196" width="36" height="14" fill="#55687a" stroke="#0a131b"/>
  </g>
  <circle cx="270" cy="190" r="7" fill="#0d1822" stroke="#f2a33a" stroke-width="3"/>
  <rect x="530" y="198" width="30" height="142" fill="#3a4b5b"/>
  <polygon points="560,262 1000,262 1000,340 560,340" fill="#2c3b49"/>
  <line x1="590" y1="262" x2="880" y2="262" stroke="#93a4b3" stroke-dasharray="12 10"/>
  <rect x="540" y="180" width="360" height="18" fill="#9fb3c6" stroke="#0a131b"/>
  <rect x="540" y="198" width="360" height="16" fill="#7d93a8" stroke="#0a131b"/>
  <rect x="900" y="198" width="100" height="142" fill="#3a4b5b"/>
  <rect x="902" y="182" width="98" height="16" fill="#7d93a8"/>
  <line x1="901" y1="176" x2="901" y2="200" stroke="#f2a33a" stroke-width="2"/>
  <polygon points="540,214 552,214 546,206" fill="#f2a33a"/><polygon points="888,214 900,214 894,206" fill="#f2a33a"/>
  <g ${MONO} font-size="12" fill="#93a4b3">
    <text x="20" y="232">ZUIDOEVER</text><text x="400" y="330" text-anchor="middle">VAARTDOK · doorvaart 25 m</text><text x="720" y="290" text-anchor="middle">kaaiweg</text><text x="950" y="232" text-anchor="middle">NOORD</text>
    <text x="405" y="170" text-anchor="middle">beweegbaar brugdek 30 m</text><text x="720" y="170" text-anchor="middle">vaste overspanning 40 m</text><text x="190" y="318" text-anchor="middle">kelder</text>
  </g>
  ${tag(1,79,92)}${tag(2,212,240)}${tag(3,258,300)}${tag(4,546,236)}${tag(5,720,236)}${tag(6,940,160)}
  </svg>`;
}
/* Bovenaanzicht; zelfde x-schaal; vaart loopt verticaal. Ook gebruikt als radar. */
function plan(o){
  o=o||{};const shipY=o.shipY??360,open=o.open||0,crash=o.crash;
  const valLen=270*Math.cos(open*Math.PI/180);
  return `<rect x="0" y="0" width="1000" height="300" fill="#0d1822"/>
  <rect x="280" y="0" width="250" height="300" fill="#173a52"/>
  <rect x="0" y="0" width="280" height="300" fill="#2a3a48"/><rect x="530" y="0" width="470" height="300" fill="#2a3a48"/>
  <rect x="150" y="120" width="120" height="60" fill="none" stroke="#93a4b3" stroke-dasharray="6 5"/>

  titel:'Het systeem herkent de brug niet meer',
  tekst:'Na de stroompanne staat het besturingssysteem in fabrieksinstelling. Om op te starten vraagt het twee dingen: eerst tabel 18.1 uit de cursus (welke beweegbare brug beweegt op welke manier), daarna het type van de Vaartdokbrug zelf.',
  fig:()=>axesSVG(),
  form:()=>`<div class="step">Stap 1 · Vul tabel 18.1 aan</div>

    <div class="grid18"><span></span><span class="h">rotatie om de as<small>draait rond de as</small></span><span class="h">translatie volgens de as<small>schuift langs de as</small></span>

  cursus:'XVIII §1 (p. 208), tabel 18.1: beweegbare bruggen worden ingedeeld volgens de wijze van bewegen: rotatie om of translatie volgens de x-as (de brugas), de y-as (horizontaal, dwars op de brug) of de z-as (verticaal).',

2:{
  titel:'De ballastkist is leeggelopen',
  tekst:'Bij de laatste herstelling werd de ballastkist leeggemaakt. Naast de kist liggen betonblokken van 50 kN. Hoeveel blokken leg je in de kist? Vul de kist zoals de cursus het voorschrijft voor een basculebrug.',
  fig:()=>ballastSVG(),
  dossier:[['Eigengewicht stalen brugdek G₁','1 500 kN'],['Slijtlaag G₂','230 kN'],['Leuningen, verlichting, slagboom G₃','120 kN'],['Arm G₁ tot draaischarnier','13,5 m'],['Arm G₂','15,0 m'],['Arm G₃','15,5 m'],['Arm ballastkist b','6,5 m'],['Staartligger en lege kist','verwaarloosd']],
  form:()=>`<div class="lock"><input id="code" inputmode="decimal" maxlength="6" placeholder="—" aria-label="Aantal blokken"><button class="btn" id="try">Vul de kist</button></div>`,
  check(){const v=num('code');
    if(isNaN(v))return {leeg:true,t:'Vul een aantal blokken in.'};

    if(v===78)return {ok:true};
    if(v===79)return {t:'Bijna. Met 79 blokken weegt de ballast net te zwaar: de brug zou vanzelf willen openen. Wat zegt de cursus over de zin van het resulterende moment?'};
    if(v>79&&v<85)return {t:'Te zwaar: de ballast trekt het brugdek omhoog.'};
    if(v>=70&&v<78)return {t:'Te licht: de vijzels zouden te veel van het gewicht moeten dragen.'};
    if(v>=3000)return {t:'Je antwoordt in kN. De vraag is hoeveel blokken van 50 kN.'};
    return {t:'De vijzels slaan af. Het evenwicht om het draaischarnier klopt niet.'};},
  cursus:'XVIII §3.1–3.2 (p. 210–211): het brugdek wordt uitgebalanceerd door een ballastkist aan het einde van de staartligger, zodat G_dek·d ≈ G_ballast·b. Er moet steeds een zekere onbalans blijven: de ballastkist wordt zo uitgebalanceerd dat een licht sluitend resulterend moment ontstaat om het draaischarnier.',
  hints:['Σ G·d = 1 500·13,5 + 230·15,0 + 120·15,5. Deel door de arm b = 6,5 m en door 50 kN per blok.','Exact evenwicht vraagt 78,6 blokken. Rond je naar boven of naar beneden af als er een licht sluitend moment moet overblijven?'],
  kern:'Uitbalanceren van een basculebrug: G_dek·d ≈ G_ballast·b, met een licht sluitend resulterend moment.',
  uitleg:'Moment van het brugdek: 20 250 + 3 450 + 1 860 = 25 560 kNm. Exact evenwicht vraagt 25 560 / 6,5 = 3 932 kN, dus 78,6 blokken. Met 78 blokken (3 900 kN · 6,5 m = 25 350 kNm) blijft een licht sluitend resulterend moment van 210 kNm over. Zo zakt het brugdek vanzelf dicht als de aandrijving uitvalt, en gaat het niet open door trillingen of windzuiging. Onthoud die 210 kNm: de machinekamer heeft ze nodig.'
},
3:{
  titel:'De vijzels staan op de verkeerde druk',
  tekst:'De ballast is in orde. Nu moet de druk van de twee hydraulische vijzels ingesteld worden. Bereken de kracht die één vijzel moet kunnen leveren om het brugdek te openen tegen de wind in.',
  fig:()=>jackSVG(),
  dossier:[['Sluitend resulterend moment (uit de kelder)','zelf invullen'],['Windmoment op het open brugdek (bedieningswind)','1 290 kNm'],['Arm vijzel tot draaischarnier t','3,0 m'],['Aantal vijzels (één per hoofdligger)','2'],['Wrijving in het draaischarnier','verwaarloosd'],['Aanname','beide momenten tellen volledig mee']],
  form:()=>`<div class="lock"><input id="code" inputmode="decimal" maxlength="6" placeholder="kN" aria-label="Kracht per vijzel in kN"><button class="btn" id="try">Stel de druk in</button></div>`,
  check(){const v=num('code');
    if(isNaN(v))return {leeg:true,t:'Vul de kracht per vijzel in, in kN.'};

    if(Math.abs(v-500)<0.5)return {t:'Dat is de totale kracht. Er zijn twee vijzels.'};
    if([70,35].some(x=>Math.abs(v-x)<0.5))return {t:'Je vergeet de wind op het open brugdek.'};
    if([430,215].some(x=>Math.abs(v-x)<0.5))return {t:'Je gebruikt het windmoment, maar niet het sluitend resulterend moment uit de kelder.'};
    if([1500,750].some(x=>Math.abs(v-x)<0.5))return {t:'Je vergeet te delen door de arm t van de vijzel.'};
    return {t:'De pompen alarmeren: verkeerde druk.'};},
  cursus:'XVIII §3.1 (p. 210): de nodige ophaalkracht is T = (G_dek·d − G_ballast·b) / t. Omdat er bewust een onbalans behouden blijft, wordt de ophaalkracht licht vergroot. §3.2 (p. 211): een basculebrug wordt geopend met hydraulische vijzels aan beide hoofdliggers.',
  hints:['De vijzels moeten twee sluitende momenten overwinnen: het sluitend resulterend moment uit de kelder en het windmoment op het open brugdek.','T_totaal = (210 + 1 290) / 3,0. Verdeel daarna over de vijzels.'],
  kern:'Ophaalkracht van de vijzels: T = (sluitend resulterend moment + windmoment) / t, verdeeld over de hoofdliggers.',
  uitleg:'T = (210 + 1 290) / 3,0 = 500 kN, dus 250 kN per vijzel. Het sluitend moment maakt de ophaalkracht iets groter, maar het is een veiligheid. In werkelijkheid verandert het moment van het eigengewicht met de openingshoek; hier tellen we het moment in gesloten stand en de wind op het open brugdek samen op, wat aan de veilige kant ligt. Het beweegbare brugdek is klaar. Nu naar de overkant van de doorvaart.'
},
4:{
  titel:'De vaste overspanning is losgeslagen',
  tekst:'Voor het beweegbare brugdek open mag, moet de vaste overspanning aan de noordkant veilig staan. Bij onderhoud werden de geleidingen van drie oplegtoestellen verwijderd. Oplegging A is volledig vast. Kies voor B, C en D welke beweging ze moeten verhinderen.',
  fig:()=>bearingSVG(!!S.solved[4]),
  dossier:[['A (pijler, west)','volledig vast'],['Overspanning','40 m, stalen dek'],['Doel','vrij uitzetten zonder parasitaire krachten, maar plaatsvast']],
  form:()=>`${['B','C','D'].map(k=>`<label for="b-${k}" class="small">Oplegging ${k}</label><select id="b-${k}"><option value="">kies…</option><option value="vast">volledig vast</option><option value="langsvast">enkel vast in langse richting (beweegt dwars, y)</option><option value="dwarsvast">enkel vast in dwarse richting (beweegt langs, x)</option><option value="los">los (beweegt in alle richtingen)</option></select>`).join('')}
    <button class="btn" id="try">Zet de opleggingen vast</button>`,
  check(){const b=document.getElementById('b-B').value,c=document.getElementById('b-C').value,d=document.getElementById('b-D').value;
    if(!b||!c||!d)return {leeg:true,t:'Kies eerst voor elke oplegging een type.'};
    if(b==='langsvast'&&c==='dwarsvast'&&d==='los')return {ok:true};
    if([b,c,d].includes('vast'))return {t:'Er mag hooguit één volledig vaste oplegging zijn; anders ontstaan parasitaire krachten door temperatuur (XXIV §6).'};
    if(d!=='los')return {t:'Denk aan de oplegging die het verst van A ligt: in welke richtingen zet de brug daar uit?'};
    if(b==='dwarsvast'&&c==='langsvast')return {t:'Omgekeerd. B staat op dezelfde pijler als A: daar zet de brug enkel in de breedte uit. C ligt in lijn met A: daar zet de brug in de lengte uit.'};
    return {t:'De overspanning verschuift of klemt. Waar zet de brug uit, en waar moet ze geleid worden?'};},
  cursus:'XXIV §2 (p. 260): een oplegtoestel kan volledig vast zijn, enkel in langse of enkel in dwarse richting vast, of los. §6 (p. 265): om parasitaire krachten te voorkomen wordt hooguit één volledig vaste oplegging gebruikt. De andere opleggingen verhinderen enkel de bewegingen die nodig zijn om de brug stabiel te houden.',
  hints:['B staat op dezelfde pijler als A: de afstand tot A loopt dwars op de brug. C ligt op één lijn met A in de langsrichting. D ligt schuin tegenover A.','B: enkel vast in langse richting. C: enkel vast in dwarse richting. D: los.'],
  kern:'Oplegschema: hooguit één volledig vaste oplegging; de andere verhinderen enkel de bewegingen die nodig zijn voor de stabiliteit.',
  uitleg:'A is volledig vast. B staat op dezelfde pijler, dus de breedte van de brug moet er kunnen uitzetten: B is enkel vast in langse richting. C ligt in lijn met A en moet de lengteverandering over 40 m volgen, maar houdt de brug zijdelings op haar plaats: C is enkel vast in dwarse richting. D is los. A en B houden de brug samen in de langsrichting vast. Kanttekening: de cursus (XXIV §6, p. 265) plaatst de vaste oplegging bij voorkeur op een landhoofd, omdat een pijler met de vaste oplegging grote horizontale krachten krijgt. Hier is gekozen voor een compromis: met de vaste opleggingen op de pijler blijft de aansluiting met de punt van het beweegbare brugdek op haar plaats, en ligt de brugdekvoeg aan het landhoofd, weg van het beweegbare deel. De pijler moet daar dan wel op ontworpen zijn. Dat merken jullie in de volgende ruimte.'
},
5:{
  titel:'De remkracht moet ingegeven worden',
  tekst:'Het monitoringsysteem van de vaste overspanning vraagt de karakteristieke remkracht waarop de vaste opleggingen A en B en de pijler gecontroleerd worden. Gebruik de formule uit hoofdstuk III.',
  fig:()=>laneSVG(),
  dossier:[['Tandemaslast rijstrook 1, Q₁k (per as)','300 kN'],['Verdeelde last rijstrook 1, q₁k','9 kN/m²'],['Breedte rijstrook 1, w₁','3,0 m'],['Lengte brugdek L','40 m'],['Aanpassingsfactoren α','1,0 (nieuwe brug)']],
  form:()=>`<div class="lock"><input id="code" inputmode="decimal" maxlength="6" placeholder="kN" aria-label="Remkracht in kN"><button class="btn" id="try">Bevestig</button></div>`,
  check(){const v=num('code');
    if(isNaN(v))return {leeg:true,t:'Vul de remkracht in, in kN.'};
    if(Math.abs(v-468)<0.5)return {ok:true};
    if([408,360].some(x=>Math.abs(v-x)<0.5))return {t:'Je mist een deel van de formule. Gebruik zowel de tandem als de verdeelde last.'};
    if([1440,1548].some(x=>Math.abs(v-x)<0.5))return {t:'Kijk nog eens naar de factoren 1,2 en 0,10 in de formule.'};
    if([800,180].some(x=>Math.abs(v-x)<0.5))return {t:'Dat zijn de grenzen van de formule. Ligt de berekende waarde ertussen?'};
    return {t:'Het systeem weigert: waarde onrealistisch.'};},
  cursus:'III §1.3 (p. 24–25): de remkracht Q_lk werkt als een langse kracht op de wegverharding. Q_lk = 1,2·Q₁k + 0,10·q₁k·w₁·L, met 180 kN ≤ Q_lk ≤ 800 kN. Daarin is w₁ de breedte van rijstrook 1 en L de lengte van het brugdek.',
  hints:['1,2·300 = 360 kN. Reken nu het tweede deel uit: 0,10 · 9 · 3,0 · 40.','Q_lk = 360 + 108. Ligt dat tussen de grenzen van 180 en 800 kN?'],
  kern:'Remkracht volgens belastingsmodel 1: Q_lk = 1,2·Q₁k + 0,10·q₁k·w₁·L, begrensd tussen 180 en 800 kN.',
  uitleg:'Q_lk = 1,2·300 + 0,10·9·3,0·40 = 360 + 108 = 468 kN. Dat ligt tussen 180 en 800 kN, dus de waarde blijft. De remkracht gaat via de opleggingen die de brug in de lengterichting vasthouden, A en B, naar de pijler. De cursus merkt op dat landhoofden remkrachten efficiënter opnemen (XXIV §7, p. 268): deze pijler moet dus zwaar genoeg uitgevoerd zijn. Laatste stop: de brugdekvoeg aan het noordlandhoofd.'
},
6:{
  titel:'De brugdekvoeg zit klem',
  tekst:'De oude brugdekvoeg aan het noordlandhoofd is te klein en klemt de brug vast. Bereken de totale lengteverandering die de voeg moet opnemen (afgerond op 1 mm), en kies een geschikt voegtype.',
  fig:()=>jointSVG(),
  dossier:[['Afstand vaste oplegging A tot voeg','40 m'],['Uitzettingscoëfficiënt staal α','12·10⁻⁶ /°C'],['Basisreferentietemperatuur T₀','10 °C'],['Min. brugtemperatuur stalen dek (Gent)','−18 °C'],['Max. brugtemperatuur stalen dek (Gent)','+54 °C']],
  form:()=>`<div class="lock"><input id="code" inputmode="decimal" maxlength="6" placeholder="mm" aria-label="Totale lengteverandering in mm"></div>
    <label for="vtype" class="small">Voegtype</label>
    <select id="vtype"><option value="">kies…</option><option value="massa">flexibele voegmassa (compoundvoeg)</option><option value="rand">voeg met randprofiel (enkelvoudig)</option><option value="mat">mattenvoeg</option><option value="vinger">uitkragende voeg (vingervoeg)</option><option value="lamel">lamellenvoeg</option></select>
    <button class="btn" id="try">Plaats de voeg</button>`,
  check(){const v=num('code'),t=document.getElementById('vtype').value;
    if(isNaN(v)||!t)return {leeg:true,t:'Vul de lengteverandering in en kies een voegtype.'};
    const juist=v>=34&&v<=35;   /* 34,56 mm: afgerond 35, of 21 + 13 = 34 als je elk deel apart afrondt */
    if(juist&&t==='rand')return {ok:true};
    if(juist&&t==='massa')return {t:'De lengte klopt, maar een flexibele voegmassa neemt maar ± 10 mm op. Hier zet de brug 21 mm uit.'};
    if(juist)return {t:'De lengte klopt. Dit voegtype kan het aan, maar het is zwaar overgedimensioneerd en duurder dan nodig.'};
    const r=Math.round(v);
    if(r===21||r===13)return {t:'Dat is maar één richting. De voeg moet zowel uitzetten als krimpen opvangen.'};
    if(r===25||r===26)return {t:'Gebruik de brugtemperaturen van een stalen dek, niet de schaduwtemperaturen.'};
    return {t:'De voeg past niet. Reken de uitzetting nog eens na.'};},
  cursus:'III §4.1.1 (p. 39–40): de lengteverandering volgt uit ΔL = α·L·ΔT, met ΔT ten opzichte van de basisreferentietemperatuur T₀ = 10 °C, zowel voor uitzetten als voor krimpen. XXV (p. 272–276): elk voegtype heeft een maximale dilatatie, van ± 10 mm (flexibele voegmassa) tot honderden millimeter (vingervoeg, lamellenvoeg).',
  hints:['ΔT+ = 54 − 10 = 44 °C en ΔT− = 10 − (−18) = 28 °C. Tel de twee verplaatsingen op.','12·10⁻⁶ · 40 000 mm · 72 °C ≈ 35 mm. Volgens XXV §3 neemt een voeg met randprofiel tot 80 à 100 mm op.'],
  kern:'Temperatuurdilatatie ΔL = α·L·ΔT ten opzichte van T₀, en de keuze van een brugdekvoeg die die dilatatie aankan.',
  uitleg:'ΔL+ = 12·10⁻⁶ · 40 000 · 44 = 21 mm en ΔL− = 12·10⁻⁶ · 40 000 · 28 = 13 mm, samen ongeveer 35 mm. Een flexibele voegmassa haalt maar ± 10 mm. Een voeg met randprofiel neemt tot 80 à 100 mm op en wordt in België zeer vaak toegepast. Alle ruimtes zijn klaar. Keer terug naar het brugwachtershuis.'
}
};

function groepTekst(){return `groep ${GROEP.nr}${GROEP.leden.length?' ('+GROEP.leden.join(', ')+')':''}`;}

function intro(){
  S.ended=false;scherm=intro;
  app.innerHTML=`<section class="panel stack">
    <div class="two">
      <div class="stack">
        <div class="eyebrow">Maandag · ${klok(START_KLOK)} · Vaartdok, haven van Gent</div>
        <h1>Een zeeschip wacht. De brug gaat niet open.</h1>
        <p>Na een stroompanne staat de Vaartdokbrug in storing en de brugwachter is onbereikbaar. Jullie zijn het ingenieursteam van wacht. Werk je van zuid naar noord door de brug, los in elke ruimte de storing op en open de brug voor het schip ertegen vaart.</p>
        <div class="radio">📻 Havenkapiteinsdienst: "Vaartdokbrug, de MV Schelde Trader vaart nu het dok in. Ze kan niet meer stoppen. U heeft ${minuten(TOTAL/60)} minuten. Over."</div>
        <div class="row"><button class="btn" id="go">Start de klok (${TOTAL/60} minuten)</button>
          <label class="chk"><input type="checkbox" id="gm"> Spelleidermodus (geen klok, alle ruimtes open)</label></div>
        <div class="row hidden" id="demo"><button class="btn ghost" id="demo-lose">Voorbeeld: game over</button><button class="btn ghost" id="demo-win">Voorbeeld: gewonnen</button></div>
        <p class="small muted">In elke ruimte staat een stukje cursus dat je gratis mag lezen. Een extra hint kost 2 minuten, een fout antwoord 1 minuut. Elke opgeloste ruimte geeft een letter; samen vormen ze het wachtwoord om de brug te openen. Klik op een tekening om ze te vergroten.</p>
        <p class="small"><a href="#over" data-about>Over dit spel: leerdoelen en bronnen →</a></p>
      </div>
      <div class="stack">
        <h3>De brug in cijfers</h3>
        <table class="dossier"><tbody>${BRUG.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
    ${figBox('Langsdoorsnede Vaartdokbrug (fictief) · zuid ← → noord','route 1 → 6',elevation())}
    ${figBox('Grondplan (bovenaanzicht) · het schip vaart van onder naar boven','',planSVG({shipY:235}))}
  </section>`;
  const gm=document.getElementById('gm');
  gm.addEventListener('change',()=>document.getElementById('demo').classList.toggle('hidden',!gm.checked));
  document.getElementById('demo-lose').addEventListener('click',()=>{S.gm=true;gameOver();});
  document.getElementById('demo-win').addEventListener('click',()=>{S.gm=true;win();});
  document.getElementById('go').addEventListener('click',()=>{S.gm=gm.checked;if(!S.gm)startClock();else hud();room(1);});
}

function about(){
  const terug=scherm;
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Over dit spel · ${VERSIE}</div>
    <h2>Escape room: De Vaartdokbrug zit vast</h2>
    <p>Item voor deel 2 van de opdracht Bruggenbouw 2026-2027, gemaakt door ${esc(groepTekst())}.${GROEP.nr==='XX'?' <span class="badge">groepsnummer en namen nog in te vullen</span>':''}</p>
    ${S.running&&!S.ended?'<p class="small muted">Let op: de klok loopt door terwijl je dit leest.</p>':''}
    <h3>Leerdoelen</h3>
    <p>Wie het spel uitspeelt, past zes onderdelen van de cursus toe op één fictieve, realistische brug: een basculebrug met kelder, gevolgd door een vaste stalen overspanning.</p>
    <ul class="plain">${ROOMS.map(r=>`<li><b>Ruimte ${r.id} · ${esc(r.naam)}:</b> ${esc(PUZ[r.id].kern)} <span class="muted">(${esc(r.hfst)})</span></li>`).join('')}</ul>
    <h3>Spelregels</h3>
    <p>Jullie hebben ${TOTAL/60} minuten. In elke ruimte staat gratis het stuk cursus dat je nodig hebt. Een extra hint kost 2 minuten, een fout antwoord 1 minuut; een leeg antwoord kost niets. Na afloop, gewonnen of verloren, toont het spel de uitleg van alle ruimtes. In spelleidermodus loopt er geen klok en zijn alle ruimtes open, handig om het spel te tonen of na te kijken.</p>
    <h3>Bronnen</h3>
    <ul class="plain"><li>Cursus Bruggenbouw 2026-2027, Prof. dr. ir. W. De Corte: hoofdstukken III (ontwerpbelastingen), XVIII (beweegbare bruggen), XXIV (brugopleggingen) en XXV (brugdekvoegen).</li><li>De Vaartdokbrug is fictief. De waarden zijn realistisch maar vereenvoudigd.</li></ul>
    <div class="row"><button class="btn" id="back">← Terug</button></div>
  </section>`;
  document.getElementById('back').addEventListener('click',()=>terug());
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{if(e.target.closest('[data-about]')){e.preventDefault();about();}});

function routeBar(){
  return `<div class="route">${ROOMS.map(r=>{
    const acc=S.gm||S.solved[r.id]||r.id===nextRoom();
    return `<button class="stop ${S.solved[r.id]?'done':''} ${r.id===S.current?'now':''}" data-go="${r.id}" ${acc?'':'disabled'}><span class="nr">${r.id} · ${esc(r.plaats)}</span><b>${esc(r.naam)}</b></button>`;}).join('')}</div>`;
}
const nextRoom=()=>{for(const r of ROOMS)if(!S.solved[r.id])return r.id;return 7;};

function room(id){
  if(S.ended)return;
  S.current=id;scherm=()=>room(S.current);
  const P=PUZ[id],R=ROOMS[id-1],done=!!S.solved[id];
  app.innerHTML=`<div class="stack">${routeBar()}
  <div class="game">
    <section class="panel stack" style="padding:12px">
      ${figBox(`Je bent hier · ruimte ${id}`,esc(R.plaats),elevation({hl:id}),'here')}
      ${figBox(`Ruimte ${id} · ${esc(R.naam)}`,`cursus: ${esc(R.hfst)}`,P.fig(),'roomfig')}
    </section>
    <section class="panel stack">
      <div class="eyebrow">Ruimte ${id} van 6 · ${esc(R.naam)}</div>
      <h2>${esc(P.titel)}</h2>
      <p>${esc(P.tekst)}</p>
      <details class="hint theory" open><summary>📘 Uit de cursus (gratis)</summary><p>${esc(P.cursus)}</p></details>
      ${P.dossier?`<table class="dossier"><thead><tr><th>Uit het dossier</th><th style="text-align:right">Waarde</th></tr></thead><tbody>${P.dossier.map(d=>`<tr><td>${d[0]}</td><td class="n">${d[1]}</td></tr>`).join('')}</tbody></table>`:''}
      <div class="stack ${done?'hidden':''}" id="form">${P.form()}</div>
      <div id="out" aria-live="polite"></div>
      <div class="stack ${done?'hidden':''}" id="hints">${P.hints.map((h,i)=>`<details class="hint" data-straf><summary>Hint ${i+1} (−2 min)</summary><p>${esc(h)}</p></details>`).join('')}</div>
      <div class="row" id="nav"></div>
    </section></div></div>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>room(+b.dataset.go)));
  app.querySelectorAll('details[data-straf]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!d.dataset.used){d.dataset.used='1';S.hints++;penalty(HINT_STRAF);}}));
  const tr=document.getElementById('try');
  if(tr){tr.addEventListener('click',()=>attempt(id));app.querySelectorAll('#form input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')attempt(id);}));}
  window.scrollTo(0,0);
  const first=app.querySelector('#form input,#form select');if(first&&!done)first.focus({preventScroll:true});
  if(done)showSolved(id);
}

function attempt(id){
  if(S.ended)return;
  const r=PUZ[id].check();
  const out=document.getElementById('out');
  if(r.leeg||r.zacht){out.innerHTML=`<div class="msg info"><b>${r.leeg?'Nog niet volledig':'Let op'}</b>${esc(r.t)}</div>`;return;}
  if(r.ok){S.solved[id]=true;hud();showSolved(id);return;}
  S.fouten++;penalty(FOUT_STRAF);
  out.innerHTML=`<div class="msg no"><b>Fout, −1 minuut</b>${esc(r.t)}</div>`;
}
function showSolved(id){
  document.getElementById('form').classList.add('hidden');
  document.getElementById('hints').classList.add('hidden');
  document.getElementById('out').innerHTML=`<div class="msg ok"><b>Opgelost · letter: ${ROOMS[id-1].letter}</b>${esc(PUZ[id].uitleg)}</div>`;
  const h=document.querySelector('#here .fig-svg');if(h)h.innerHTML=elevation({hl:id});
  const rf=document.querySelector('#roomfig .fig-svg');if(rf)rf.innerHTML=PUZ[id].fig();
  const n=nextRoom(),nav=document.getElementById('nav');
  nav.innerHTML=n<=6?`<button class="btn" id="nx">Verder naar ruimte ${n}: ${esc(ROOMS[n-1].naam)} →</button>`:`<button class="btn" id="nx">Terug naar het brugwachtershuis →</button>`;
  document.getElementById('nx').addEventListener('click',()=>n<=6?room(n):finale());
  document.querySelectorAll('.stop').forEach(b=>{const r=+b.dataset.go;b.classList.toggle('done',!!S.solved[r]);b.disabled=!(S.gm||S.solved[r]||r===nextRoom());});
}

function finale(){
  if(S.ended)return;
  scherm=finale;
  const got=ROOMS.map(r=>r.letter);
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Brugwachtershuis · laatste stap</div>
    <h2>Het systeem vraagt het wachtwoord</h2>
    <p>Alle storingen zijn opgelost. Op het scherm verschijnt: <b>"Geef het principe waarop elke beweegbare brug steunt."</b> De zes letters die jullie verzamelden staan door elkaar: <b style="font-family:var(--mono);letter-spacing:.2em">${got.join(' ')}</b></p>
    <div class="lock"><input class="word" id="word" maxlength="6" placeholder="······" aria-label="Wachtwoord"><button class="btn" id="open">Open de brug</button></div>
    <div id="out" aria-live="polite"></div>
    <details class="hint" data-straf><summary>Hint (−2 min)</summary><p>Ballastkist, contragewicht, sluitend moment: het gaat altijd om …</p></details>
    ${figBox('Langsdoorsnede','',elevation())}
  </section>`;
  app.querySelector('details[data-straf]').addEventListener('toggle',e=>{const d=e.target;if(d.open&&!d.dataset.used){d.dataset.used='1';S.hints++;penalty(HINT_STRAF);}});
  window.scrollTo(0,0);
  const w=document.getElementById('word');w.focus({preventScroll:true});
  const go=()=>{if(S.ended)return;
    const v=w.value.trim().toUpperCase();
    if(!v){document.getElementById('out').innerHTML=`<div class="msg info"><b>Nog niet volledig</b>Typ eerst een wachtwoord van zes letters.</div>`;return;}
    if(v===FINAL_WORD){win();}
    else{S.fouten++;penalty(FOUT_STRAF);document.getElementById('out').innerHTML=`<div class="msg no"><b>Toegang geweigerd, −1 minuut</b>Herschik de zes letters.</div>`;}};
  document.getElementById('open').addEventListener('click',go);w.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}

function debrief(titel){
  return `<div class="stack"><h3>${titel}</h3>${ROOMS.map(r=>`<details class="hint"><summary>${S.solved[r.id]?'✓':'○'} Ruimte ${r.id} · ${esc(r.naam)} <span class="muted small">· ${esc(r.hfst)}</span></summary><p><b>${esc(PUZ[r.id].kern)}</b></p><p>${esc(PUZ[r.id].uitleg)}</p></details>`).join('')}
    <p class="small"><a href="#over" data-about>Over dit spel: leerdoelen en bronnen →</a></p></div>`;
}

function animateOpen(el){
  if(!el)return;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){el.innerHTML=elevation({open:75});return;}
  let a=0;const step=()=>{a+=1.5;if(!el.isConnected)return;el.innerHTML=elevation({open:Math.min(75,a)});if(a<75)requestAnimationFrame(step);};step();
}

function win(){
  S.ended='win';clearInterval(tick);hud();scherm=win;
  const t=used();
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Brugwachtershuis · ${klok(START_KLOK+t)}</div>
    <h1>De brug gaat open. De MV Schelde Trader vaart door.</h1>
    <div class="row" style="gap:28px">
      <div><div class="big good">${S.gm?'—':fmt(t)}</div><div class="muted">gebruikte tijd incl. straf</div></div>
      <div><div class="big" style="color:var(--amber)">${S.hints}</div><div class="muted">hints</div></div>
      <div><div class="big" style="color:var(--amber)">${S.fouten}</div><div class="muted">fouten</div></div>
    </div>
    <div class="radio">📻 "Vaartdokbrug, hier de Schelde Trader. Mooi werk, ingenieurs. Over en sluiten."</div>
    ${figBox('Langsdoorsnede · beweegbaar brugdek open (75°)','licht sluitend moment · vijzels 2 × 250 kN','','elevfig')}
    ${debrief('Wat hebben jullie toegepast?')}
    <div class="row"><button class="btn" id="again">Opnieuw spelen</button></div>
  </section>`;
  window.scrollTo(0,0);
  animateOpen(document.querySelector('#elevfig .fig-svg'));
  document.getElementById('again').addEventListener('click',()=>location.reload());
}

function gameOver(){
  S.ended='lose';clearInterval(tick);hud();scherm=gameOver;
  const n=Object.keys(S.solved).length;
  app.innerHTML=`<section class="panel stack shake" id="go-panel">
    <div class="eyebrow" style="color:var(--bad)">${klok(START_KLOK+TOTAL)} · aanvaring</div>
    <div class="big bad">GAME OVER</div>
    <h2>De MV Schelde Trader ramt het gesloten brugdek.</h2>
    <p>De tijd was op. Het schip kon niet meer stoppen en voer tegen de Vaartdokbrug. Jullie losten ${n} van de 6 ruimtes op. Hieronder staan de oplossing en de uitleg van elke ruimte.</p>
    <div class="fig"><div class="cap"><span>Bovenaanzicht · het schip nadert</span><span style="color:var(--bad)" id="crash-cap"></span></div><svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" id="crash"></svg></div>
    ${debrief('Bekijk de oplossingen')}
    <div class="row"><button class="btn" id="again">Probeer opnieuw</button></div>
  </section>`;
  window.scrollTo(0,0);
  document.getElementById('again').addEventListener('click',()=>location.reload());
  const svg=document.getElementById('crash'),panel=document.getElementById('go-panel');panel.classList.remove('shake');
  const rays=`<g stroke="#f2a33a" stroke-width="4">${Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<line x1="${405+Math.cos(a)*20}" y1="${170+Math.sin(a)*20}" x2="${405+Math.cos(a)*45}" y2="${170+Math.sin(a)*45}"/>`;}).join('')}</g>`;
  const end=()=>{if(!svg.isConnected)return;svg.innerHTML=plan({shipY:176,crash:true})+rays;document.getElementById('crash-cap').textContent='aanvaring';void panel.offsetWidth;panel.classList.add('shake');};
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){end();return;}
  const t0=performance.now(),dur=2600;
  const step=now=>{if(!svg.isConnected)return;const p=Math.min(1,(now-t0)/dur);svg.innerHTML=plan({shipY:330-p*(330-176)});if(p<1)requestAnimationFrame(step);else end();};
  requestAnimationFrame(step);
}

document.getElementById('foot').innerHTML=`Fictieve brug met realistische, vereenvoudigde waarden · ${VERSIE} · <a href="#over" data-about>Over dit spel</a>`;
intro();hud();
</script>
</body>
</html>
