<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape room Vaartdokbrug</title>
<meta name="description" content="Escape room voor het vak Bruggenbouw: open de beweegbare Vaartdokbrug voor het schip ertegen vaart.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Controlekamer bij nacht: donker staalblauw, amberkleurige displays; groen = opgelost, rood = alarm */
  --bg:#0f1b26;
  --panel:#162534;
  --ink:#e6edf2;
  --muted:#93a4b3;
  --line:#2a3d4f;
  --amber:#f2a33a;
  --good:#4cc38a;
  --bad:#ef6b5b;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100vh}
button,select,input{font:inherit}
button{cursor:pointer}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px}
/* De kop met klok blijft bovenaan staan, ook als je naar beneden scrolt */
header{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.disp{font-family:var(--mono);font-weight:600;font-size:20px;color:var(--amber);background:#0a131b;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-variant-numeric:tabular-nums;min-width:92px;text-align:center}
.disp.warn{color:var(--bad)}
.disp small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.letters{display:flex;gap:4px;align-items:center}
.letters span{width:30px;height:38px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:20px;background:#0a131b;border:1px solid var(--line);border-radius:5px;color:var(--good)}
.radar{background:#0a131b;border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:190px;display:flex;flex-direction:column;gap:2px}
.radar small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-align:center;font-weight:500}
.radar svg{display:block;width:100%;height:auto;border-radius:3px}
@media (max-width:860px){
  header{grid-template-columns:1fr;padding:8px 0;gap:6px}
  .brand{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:none}
  .radar{display:none}
  .hud{gap:6px;flex-wrap:nowrap}
  .disp{font-size:16px;min-width:0;flex:1 1 0;padding:3px 6px}
  .letters{gap:3px}
  .letters span{width:22px;height:34px;font-size:15px}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(30px,5vw,50px);font-weight:900;letter-spacing:-.02em}
h2{font-size:25px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{background:var(--amber);color:#1b1205;border:0;border-radius:6px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.radio{font-family:var(--mono);font-size:15px;background:#0a131b;border-left:3px solid var(--amber);padding:12px 14px;border-radius:0 6px 6px 0;color:#f6d7a8}
.fig{background:#0d1822;border:1px solid var(--line);border-radius:8px;padding:8px}
.fig svg{display:block;width:100%;height:auto}
.fig.zoomable{cursor:zoom-in}
.fig.zoomable:hover{border-color:#3d566d}
.cap{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 4px 8px}
.zoom{position:fixed;inset:0;z-index:100;background:rgba(4,9,14,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.zoom-in{background:#0d1822;border:1px solid var(--line);border-radius:10px;padding:10px;width:min(1500px,100%);max-height:100%;overflow:auto}
.zoom-in svg{display:block;width:100%;height:auto;min-width:860px}
.zoom-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;left:0;margin-bottom:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.dossier{width:100%;border-collapse:collapse;font-size:15px}
table.dossier th,table.dossier td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.dossier th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table.dossier td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;max-width:55%}
.game{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.game{grid-template-columns:1fr}}
.lock{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.lock input{font-family:var(--mono);font-size:26px;font-weight:600;width:140px;text-align:center;background:#0a131b;color:var(--amber);border:1px solid var(--line);border-radius:6px;padding:6px}
.lock input.word{width:220px;text-transform:uppercase;letter-spacing:.2em}
select{background:#0a131b;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.grid18{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}
.grid18 .ax{padding-top:6px}
.grid18 .h{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);line-height:1.3;align-self:end}
.grid18 .h small,.grid18 .ax small,.vb small{display:block;font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.grid18 .ax{font-family:var(--mono);font-size:14px;color:var(--amber);line-height:1.2}
.vb{border:1px dashed var(--line);border-radius:6px;padding:5px 10px;color:var(--ink);background:#0a131b;line-height:1.3}
.cel{display:flex;flex-direction:column;gap:4px;min-width:0}
.mini svg{display:block;width:100%;max-width:150px;height:auto;border-radius:6px}
.mini-cap{font-size:12px;line-height:1.3}
/* kleine bewegingsanimaties van de brugtypes (ruimte 1) */
.beweeg{transform-box:view-box;animation-duration:2.8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.m-z-r{animation-name:mzr}.m-x-r{animation-name:mxr}.m-y-r{animation-name:myr}.m-x-t{animation-name:mxt}.m-z-t{animation-name:mzt}
@keyframes mzr{0%,20%{transform:rotate(0)}50%,70%{transform:rotate(90deg)}100%{transform:rotate(0)}}
@keyframes mxr{0%,20%{transform:rotate(0)}50%,70%{transform:rotate(-55deg)}100%{transform:rotate(0)}}
@keyframes myr{0%,20%{transform:rotate(0)}50%,70%{transform:rotate(-60deg)}100%{transform:rotate(0)}}
@keyframes mxt{0%,20%{transform:translateX(0)}50%,70%{transform:translateX(-44px)}100%{transform:translateX(0)}}
@keyframes mzt{0%,20%{transform:translateY(0)}50%,70%{transform:translateY(-22px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.beweeg{animation:none}}
.step{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border-top:1px solid var(--line);padding-top:12px}
.msg{border-left:4px solid var(--line);background:#0f1d2a;padding:10px 12px;border-radius:0 6px 6px 0}
.msg.ok{border-color:var(--good)}
.msg.no{border-color:var(--bad)}
.msg.info{border-color:var(--amber)}
.msg b{display:block}
details.hint{background:#0f1d2a;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
details.hint summary{cursor:pointer;font-weight:600}
details.hint p{margin-top:6px}
details.theory{background:#11241b;border-color:#2f5a43}
details.theory summary{color:var(--good)}
.route{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stop{background:#0f1d2a;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--ink);min-width:0;overflow-wrap:anywhere;hyphens:auto}
.stop .nr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stop b{font-size:15px}
.stop.now{border-color:var(--amber)}
.stop.done{border-color:var(--good)}
.stop:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:760px){.route{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stop{padding:7px}.stop b{font-size:13px;line-height:1.3}.stop .nr{font-size:11px}}
.big{font-family:var(--display);font-weight:900;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
.big.good{color:var(--good)}
.big.bad{color:var(--bad)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
ul.plain{margin:0;padding-left:20px}
ul.plain li{margin:5px 0;max-width:76ch}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid var(--amber);color:var(--amber)}
/* Geluidsknop, radioberichten, hervatten, blokkenteller */
.disp.snd{cursor:pointer;min-width:64px;color:var(--ink)}
.disp.snd span{font-size:18px;line-height:1.3}
.toast{position:fixed;top:96px;right:16px;z-index:60;max-width:min(440px,calc(100vw - 32px));background:#0a131b;border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:8px;padding:12px 40px 12px 14px;font-family:var(--mono);font-size:14px;line-height:1.5;color:#f6d7a8;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast b{color:var(--amber)}
.toast button{position:absolute;top:6px;right:6px;background:none;border:0;color:var(--muted);font-size:16px;padding:4px 8px}
.resume{border:1px solid var(--amber);background:#1d1a10;border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.teller{display:grid;grid-template-columns:auto auto minmax(60px,110px) auto auto;gap:6px;align-items:stretch;justify-content:start}
.teller input{font-family:var(--mono);font-size:26px;font-weight:600;width:100%;min-width:0;text-align:center;background:#0a131b;color:var(--amber);border:1px solid var(--line);border-radius:6px;padding:6px}
.teller .btn{padding:8px 12px;font-family:var(--mono)}
@media (max-width:420px){.teller .btn{padding:8px 9px}.teller input{font-size:22px}}
@media (max-width:860px){
  .disp.snd{flex:0 0 auto;min-width:0;padding:3px 8px}.disp.snd small{display:none}
  .toast{top:auto;bottom:16px;left:16px;right:16px;max-width:none}
}

/* ===== v13: vlottere indeling en controlekamerstijl ===== */
body{background:
  radial-gradient(1200px 600px at 70% -10%,rgba(38,74,104,.45),transparent 70%),
  linear-gradient(rgba(127,176,255,.035) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(127,176,255,.035) 1px,transparent 1px) 0 0/28px 28px,
  var(--bg);background-attachment:fixed}
header{background:rgba(15,27,38,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.panel{background:linear-gradient(180deg,#1b2e40 0,#162534 140px);border-color:#2b4157;border-top-color:#3a5570;border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 14px 34px rgba(0,0,0,.3)}
.disp{box-shadow:inset 0 0 14px rgba(0,0,0,.6);text-shadow:0 0 10px rgba(242,163,58,.35)}
.disp.warn{text-shadow:0 0 10px rgba(239,107,91,.55)}
.letters span{box-shadow:inset 0 0 10px rgba(0,0,0,.6)}
.letters span.vol{border-color:#2f6b4c;text-shadow:0 0 10px rgba(76,195,138,.6)}
.letters span.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.4);background:#1f4a35}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.toast{top:calc(var(--kop,84px) + 10px)}
/* knoppen met een fysiek gevoel */
.btn{background:linear-gradient(180deg,#f8b858,#e8952a);box-shadow:0 2px 0 #9c5f17,0 8px 18px rgba(242,163,58,.16);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #9c5f17}
.btn.ghost{background:rgba(255,255,255,.02);box-shadow:none}
.btn.ghost:hover{border-color:#4a6580;background:rgba(255,255,255,.05);filter:none}
.btn.klein{padding:6px 10px;font-size:14px}
.btn.groot{padding:14px 22px;font-size:18px}
/* routebalk met statuslampjes: rood = storing, oranje = hier, groen = verholpen */
.stop{position:relative;padding-left:30px;transition:border-color .2s,background .2s}
.stop:not(:disabled):hover{background:#13263a}
.stop::before{content:"";position:absolute;left:11px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px rgba(239,107,91,.8)}
.stop.done::before{background:var(--good);box-shadow:0 0 8px rgba(76,195,138,.8)}
.stop.now{background:#1d2c3b}
.stop.now::before{background:var(--amber);box-shadow:0 0 10px rgba(242,163,58,.9);animation:knipper 1.4s ease-in-out infinite}
.stop.now.done::before{background:var(--good);box-shadow:0 0 10px rgba(76,195,138,.9);animation:none}
.stop:disabled::before{background:#6b2c26;box-shadow:none}
@keyframes knipper{50%{opacity:.35}}
@media (max-width:760px){.stop{padding-left:22px}.stop::before{left:8px;top:12px;width:8px;height:8px}}
/* ruimte: de tekening links blijft in beeld terwijl je rechts leest en antwoordt */
.game{grid-template-columns:minmax(0,1.3fr) minmax(340px,1fr)}
.scene{padding:12px;display:flex;flex-direction:column;gap:12px}
.scene.kleeft{position:sticky;top:calc(var(--kop,84px) + 12px)}
.bediening{border-top:1px solid var(--line);padding-top:12px}
.opl-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
.opl-grid label{font-family:var(--mono);font-size:14px;color:var(--amber);white-space:nowrap}
.schuif{width:100%;accent-color:var(--amber);height:28px;cursor:pointer}
.eenheid{align-self:center;font-family:var(--mono);font-size:14px;color:var(--muted)}
.meter{position:relative;height:14px;border-radius:7px;background:#0a131b;border:1px solid var(--line);margin:20px 0 6px}
.meter .zone{position:absolute;top:0;bottom:0;background:#2f6b4c;border-radius:6px}
.meter .naald{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:#e6edf2;border-radius:2px;transition:left .2s}
.meter .tick{position:absolute;top:-18px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.scene-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scene-bar .btn{margin-left:auto}
.lamp{width:12px;height:12px;border-radius:50%;flex:none;background:var(--bad);box-shadow:0 0 10px rgba(239,107,91,.9);animation:knipper 1.2s ease-in-out infinite}
.lamp.ok{background:var(--good);box-shadow:0 0 10px rgba(76,195,138,.9);animation:none}
.console{gap:12px}
.console>p{font-size:16px}
.console details.theory p{font-size:15px}
@media (max-width:960px){.game{grid-template-columns:1fr}.scene{position:static}.console{order:-1}}
/* gegevens als compact raster in twee kolommen */
.data{border:1px solid var(--line);border-radius:8px;background:#122030;padding:10px 12px}
.data-kop{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.data dl{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
.data dl>div{display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px dashed #23364a;padding-bottom:4px;min-width:0}
.data dt{font-size:13px;color:var(--muted);line-height:1.3}
.data dd{margin:0;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink)}
.hero .data dl{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.hero .data dl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:359px){.data dl,.hero .data dl{grid-template-columns:1fr}}
/* vlotte overgang tussen schermen en een tik bij een fout antwoord */
#app>*{animation:inkomen .3s ease-out}
@keyframes inkomen{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wiebel{animation:shake .4s 1}
/* beloningskaart bij een opgeloste ruimte */
.solved-card{background:linear-gradient(180deg,#183327,#142534 60%);border:1px solid #2f6b4c;border-radius:14px;padding:22px;max-width:620px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:kaartIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes kaartIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.sv-top{display:flex;gap:16px;align-items:center}
.big-letter{width:72px;height:84px;flex:none;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:46px;color:var(--good);background:#0a131b;border:1px solid #2f6b4c;border-radius:10px;text-shadow:0 0 18px rgba(76,195,138,.7);animation:pop .8s ease-out}
/* startscherm */
.hero h1{font-size:clamp(34px,5vw,56px)}
.regels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.regels div{background:#122030;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.35}
.regels b{display:block;font-family:var(--mono);font-size:13px;color:var(--amber)}
/* ===== v16: doorzoeken, sterren, finale en spanning ===== */
.voorwerpen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.voorwerp{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:#122030;border:1px dashed #3d566d;border-radius:10px;padding:10px 6px;color:var(--ink);position:relative;transition:transform .12s,border-color .2s,background .2s}
.voorwerp:hover{transform:translateY(-2px);border-color:var(--amber);background:#172a3d}
.voorwerp.gevonden{border-style:solid;border-color:#2f6b4c;background:#11241b}
.vw-icoon{font-size:28px;line-height:1}
.vw-naam{font-size:13px;line-height:1.25}
.vw-ok{position:absolute;top:4px;right:7px;color:var(--good);font-weight:700}
.vw-kaart{background:linear-gradient(180deg,#1f2c3a,#142534);border:1px solid #3d566d;border-radius:14px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:flex-start;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:kaartIn .3s cubic-bezier(.2,.9,.3,1.2)}
.vw-groot{font-size:52px;line-height:1}
.vw-tekst{font-family:var(--mono);font-size:15px;line-height:1.6;background:#f3ead7;color:#2b2418;border-radius:6px;padding:12px 14px;max-width:none;box-shadow:inset 0 0 0 1px #d8c9a6}
.data dl>div.onbekend dt{opacity:.6}
.data dl>div.onbekend dd{color:var(--muted);font-weight:500;font-size:13px;font-style:italic}
.st{display:block;font-size:12px;letter-spacing:.1em;color:var(--amber);margin-top:2px}
details summary .st{display:inline}
.sterren{font-size:22px;letter-spacing:.12em;color:var(--amber);text-shadow:0 0 12px rgba(242,163,58,.45)}
.sterren.groot{font-family:var(--mono);font-size:26px;letter-spacing:.04em}
.rang{border:1px solid #6b5426;background:linear-gradient(180deg,#2a2412,#1a2230);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.rang-titel{font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,34px);color:var(--amber)}
.badge-rec{display:inline-block;align-self:flex-start;background:var(--amber);color:#1b1205;font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}
.prestaties{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.prestatie{display:flex;gap:10px;align-items:center;background:#122030;border:1px solid #2f6b4c;border-radius:10px;padding:8px 10px}
.prestatie>span{font-size:24px}
.prestatie b{display:block;font-size:14px}
.prestatie small{color:var(--muted);font-size:12px}
.paneel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:#0a131b;border:1px solid var(--line);border-radius:12px;padding:16px}
.pknop{display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,#24384c,#1a2a3a);color:var(--ink);border:1px solid #3d566d;border-radius:12px;padding:16px 8px;font-weight:600;box-shadow:0 4px 0 #0c1620;transition:transform .08s,box-shadow .08s}
.pknop:active{transform:translateY(3px);box-shadow:0 1px 0 #0c1620}
.pknop .pi{font-size:28px}
.plamp{width:14px;height:14px;border-radius:50%;background:#3a1f1c;box-shadow:inset 0 0 4px rgba(0,0,0,.6)}
/* systeemcontrole (metapuzzel in de finale) */
.meta{display:flex;flex-direction:column;gap:8px}
.meta-rij{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:#0a131b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .2s}
.meta-rij label{font-weight:600;line-height:1.3}
.meta-rij label small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meta-rij .lock input{width:120px;font-size:22px}
.meta-msg{grid-column:2 / -1;font-size:13px;min-height:0}
.meta-msg:empty{display:none}
.meta-rij.ok{border-color:#2f6b4c}.meta-rij.ok .plamp{background:var(--good);box-shadow:0 0 12px rgba(76,195,138,.9)}.meta-rij.ok .meta-msg{color:var(--good)}
.meta-rij.fout{border-color:var(--bad)}.meta-rij.fout .plamp{background:var(--bad);box-shadow:0 0 10px rgba(239,107,91,.8)}.meta-rij.fout .meta-msg{color:#f3a79c}
@media (max-width:560px){.meta-rij{grid-template-columns:auto minmax(0,1fr)}.meta-rij .lock{grid-column:2}.meta-msg{grid-column:1 / -1}}
.pknop.aan{border-color:#2f6b4c}
.pknop.aan .plamp{background:var(--good);box-shadow:0 0 12px rgba(76,195,138,.9)}
@media (max-width:520px){.voorwerpen,.paneel{grid-template-columns:1fr}.voorwerp{flex-direction:row;justify-content:flex-start;text-align:left;padding:8px 10px}.pknop{flex-direction:row;justify-content:flex-start}}
body.krap::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:25;box-shadow:inset 0 0 140px rgba(239,107,91,.38);animation:puls 1.3s ease-in-out infinite}
body.krap #clock{animation:puls 1s ease-in-out infinite}
@keyframes puls{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){#app>*,.solved-card,.big-letter,.letters span.pop,.stop.now::before,.lamp,.vw-kaart,body.krap::after,body.krap #clock{animation:none!important}}
footer{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.shake{animation:shake .5s 3}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <div class="brand">Escape room · De Vaartdokbrug zit vast<small>BRUGGENBOUW · HOOFDSTUKKEN III, XVIII, XXIV EN XXV · FICTIEVE BRUG, REALISTISCHE WAARDEN</small></div>
    <div class="hud" id="hud">
      <div class="disp" id="clock"><small>TIJD</small>--:--</div>
      <div class="disp" id="pen"><small>STRAF</small>+00:00</div>
      <div class="letters" id="letters" aria-label="Verzamelde letters"></div>
      <button class="disp snd" id="snd" type="button" aria-label="Geluid aan of uit"><small>GELUID</small><span id="snd-ico">🔊</span></button>
      <div class="radar"><small>SCHIP NADERT</small><svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" id="radar" role="img" aria-label="Bovenaanzicht: het schip nadert de brug"></svg></div>
    </div>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>

<script>
/* =====================================================================
   INSTELLINGEN — hier pas je het spel aan
   ===================================================================== */
const VERSIE='v17';
const GROEP={nr:'XX',leden:[]};      // TODO groep: vul het groepsnummer en de namen in, bv. {nr:'07',leden:['Naam 1','Naam 2','Naam 3','Naam 4']}
const TOTAL=45*60;                     // speeltijd in seconden (v10: 30 min, na speltest verhoogd)
const START_KLOK=5*3600+58*60;         // verhaalklok bij de start: 05:58
const HINT_STRAF=120, FOUT_STRAF=60;   // in seconden
const OPSLAG='vaartdokbrug-spel';       // naam waaronder de browser de voortgang bewaart

/* Radioberichten tijdens het spel: verschijnen als er nog 'rest' seconden over zijn */
const RADIO=[
  {rest:30*60,wie:'Schelde Trader',tekst:'Vaartdokbrug, hier de Schelde Trader. We varen het dok in aan vier knopen. Hoe staat het met de brug? Over.'},
  {rest:15*60,wie:'Havenkapiteinsdienst',tekst:'Vaartdokbrug, het schip is nog een kwartier van de brug. Meld het zodra de brug open is. Over.'},
  {rest:5*60,wie:'Schelde Trader',tekst:'Vaartdokbrug, we zien de brug en ze is nog dicht! We kunnen niet meer stoppen! Over.'},
  {rest:60,wie:'Schelde Trader',tekst:'Nog één minuut! Alle bemanning naar achteren!'}
];

/* =====================================================================
   DE FICTIEVE BRUG
   ===================================================================== */
const BRUG=[
  ['Beweegbaar brugdek (draaischarnier tot punt)','30,0 m'],
  ['Vrije doorvaartbreedte','25,0 m'],
  ['Vaste overspanning (pijler tot noordelijk landhoofd)','40,0 m'],
  ['Breedte brugdek: 2 rijstroken van 3,0 m + 2 fietspaden','11,0 m'],
  ['Beweegbaar brugdek','orthotrope rijvloer (staal)'],
  ['Staartligger (draaischarnier tot ballastkist)','6,5 m'],
  ['Openingshoek beweegbaar brugdek','75°'],
  ['Aandrijving: hydraulische vijzels (één per hoofdligger)','2']
];

/* =====================================================================
   RUIMTES — vaste volgorde, van zuid naar noord over de brug
   ===================================================================== */
const ROOMS=[
  {id:1,naam:'Brugwachtershuis',plaats:'zuidoever',hfst:'XVIII §1 · p. 208'},
  {id:2,naam:'Kelder: ballastkist',plaats:'onder de zuidoever',hfst:'XVIII §3.1–3.2 · p. 210–211'},
  {id:3,naam:'Machinekamer: vijzels',plaats:'kelder',hfst:'XVIII §3.1–3.2 · p. 210–211'},
  {id:4,naam:'Pijler: opleggingen',plaats:'noordkant van de doorvaart',hfst:'XXIV §2 en §6 · p. 259–265'},
  {id:5,naam:'Vaste overspanning: remkracht',plaats:'op het brugdek',hfst:'III §1.3 · p. 24–25'},
  {id:6,naam:'Noordlandhoofd: brugdekvoeg',plaats:'noordoever',hfst:'III §4.1.1 en XXV · p. 39–40, 272–274'}
];
const FINAL_WORD='BALANS';   // elke ruimte geeft één letter; de volgorde is per spel willekeurig

/* =====================================================================
   STAAT, KLOK EN HULPFUNCTIES
   ===================================================================== */
const S={start:null,penalty:0,running:false,solved:{},hints:0,fouten:0,current:1,ended:false,gm:false,
  letters:null,hintsUsed:{},radio:{},scherm:'room',r2n:0,r2ang:0,r2test:null,
  r3T:0,r3view:'jack',r3ang:0,r3msg:null,          /* ruimte 3: vijzelkracht en proefopening */
  r4:{B:'',C:'',D:''},r4uitz:0,r4res:null,          /* ruimte 4: gekozen opleggingen en temperatuurtest */
  gevonden:{},foutenPer:{},                          /* doorzochte voorwerpen en fouten per ruimte (voor de sterren) */
  meta:{},                                           /* juist ingevulde velden van de systeemcontrole in de finale */
  r5:{a:'',b:''},r5x:null,r5rem:0,r5som:null,r5ok:false, /* ruimte 5: twee delen van de formule en de remmende vrachtwagen */
  r6:{mm:'',type:''},r6m:null,r6T:null,r6res:null}; /* ruimte 6: invoer, beweging en temperatuur tijdens de test */
/* Letters van BALANS in willekeurige volgorde over de ruimtes, nooit al in de juiste volgorde */
function schud(){const w=FINAL_WORD.split('');let a;do{a=w.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}while(a.join('')===FINAL_WORD);return a;}
S.letters=schud();
const letterVan=id=>S.letters[id-1];

/* Voortgang bewaren in de browser, zodat vernieuwen de pagina het spel niet wist */
const BEWAAR=['start','penalty','running','solved','hints','fouten','current','ended','gm','letters','hintsUsed','radio','scherm','r2n','r2test','r3T','r4','r5','r6','gevonden','foutenPer','meta'];
function bewaar(){try{const d={};BEWAAR.forEach(k=>d[k]=S[k]);localStorage.setItem(OPSLAG,JSON.stringify(d));}catch(e){}}
function laad(){try{const d=JSON.parse(localStorage.getItem(OPSLAG)||'null');return d&&Array.isArray(d.letters)?d:null;}catch(e){return null;}}
function wis(){try{localStorage.removeItem(OPSLAG);}catch(e){}}

/* Geluid, gemaakt in de browser zelf (geen geluidsbestanden nodig) */
const geluid=(()=>{
  let ctx=null,aan=true;
  try{aan=localStorage.getItem(OPSLAG+'-geluid')!=='uit';}catch(e){}
  const init=()=>{try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)ctx=new AC();}if(ctx&&ctx.state==='suspended')ctx.resume();}catch(e){}return ctx;};
  const toon=(freq,dur,type,vol,delay,filt)=>{if(!aan)return;const c=init();if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.04);g.gain.setValueAtTime(vol,t+Math.max(0.05,dur-0.15));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);let n=o;if(filt){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;o.connect(f);n=f;}n.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.05);};
  const ruis=(dur,vol)=>{if(!aan)return;const c=init();if(!c)return;const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(Math.random()<0.3?1:0.3);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const g=c.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(c.destination);s.start();};
  return {
    init,
    get aan(){return aan;},
    zet(v){aan=v;try{localStorage.setItem(OPSLAG+'-geluid',v?'aan':'uit');}catch(e){}},
    hoorn(sterkte){const v=0.06+0.16*Math.max(0,Math.min(1,sterkte||0));toon(92,1.7,'sawtooth',v,0,420);toon(138,1.7,'sawtooth',v*0.6,0,420);},
    radio(){ruis(0.35,0.1);},
    fout(){toon(140,0.3,'square',0.07,0,900);},
    goed(){toon(660,0.18,'sine',0.11);toon(880,0.32,'sine',0.11,0.15);},
    open(){toon(523,0.22,'sine',0.11);toon(659,0.22,'sine',0.11,0.18);toon(784,0.5,'sine',0.11,0.36);},
    vondst(){toon(880,0.12,'triangle',0.09);toon(1320,0.2,'triangle',0.07,0.09);},
    klik(){toon(620,0.07,'square',0.05);},
    tik(){toon(1500,0.035,'square',0.025);}
  };
})();
function toonGeluidsknop(){document.getElementById('snd-ico').textContent=geluid.aan?'🔊':'🔇';document.getElementById('snd').setAttribute('aria-pressed',String(!geluid.aan));}
document.getElementById('snd').addEventListener('click',()=>{geluid.zet(!geluid.aan);toonGeluidsknop();if(geluid.aan)geluid.goed();});
toonGeluidsknop();

/* Radioberichten */
function radioCheck(l){let laatste=null;RADIO.forEach((m,i)=>{if(m.rest<TOTAL&&!S.radio[i]&&l<=m.rest){S.radio[i]=true;laatste=m;}});if(laatste){bewaar();toonRadio(laatste,l);}}
function toonRadio(m,l){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML=`📻 <b>${esc(m.wie)}:</b> "${esc(m.tekst)}"<button type="button" aria-label="Bericht sluiten">✕</button>`;
  document.body.appendChild(t);
  t.querySelector('button').addEventListener('click',()=>t.remove());
  setTimeout(()=>t.remove(),14000);
  geluid.radio();setTimeout(()=>geluid.hoorn(1-l/TOTAL),450);
}
const app=document.getElementById('app');
let tick=null;
let scherm=()=>intro();   // het scherm waar "Terug" naartoe gaat
const fmt=s=>{const n=s<0;s=Math.abs(Math.round(s));return (n?'-':'')+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const klok=s=>{s=Math.round(s);return String(Math.floor(s/3600)%24).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0');};
const MINWOORD={15:'vijftien',20:'twintig',25:'vijfentwintig',30:'dertig',35:'vijfendertig',40:'veertig',45:'vijfenveertig',50:'vijftig',60:'zestig'};
const minuten=n=>MINWOORD[n]||String(n);
const used=()=>S.start?(Date.now()-S.start)/1000+S.penalty:S.penalty;
const left=()=>TOTAL-used();
function num(id){const el=document.getElementById(id);if(!el)return NaN;const t=el.value.trim().replace(/\s/g,'').replace(',','.');return t===''?NaN:Number(t);}
function hud(){
  const l=left();const c=document.getElementById('clock');
  c.innerHTML=`<small>${S.gm?'SPELLEIDER':'TIJD'}</small>${S.gm?'—':fmt(Math.max(0,l))}`;c.classList.toggle('warn',!S.gm&&S.running&&l<300);
  document.getElementById('pen').innerHTML=`<small>STRAF</small>+${fmt(S.penalty)}`;
  const lh=ROOMS.map(r=>`<span class="${S.solved[r.id]?'vol':''}${r.id===S.nieuw?' pop':''}">${S.solved[r.id]?letterVan(r.id):''}</span>`).join('');
  const le=document.getElementById('letters');if(le.dataset.h!==lh){le.innerHTML=lh;le.dataset.h=lh;}   /* enkel hertekenen bij een nieuwe letter */
  radar();
  /* spanning: onder 5 minuten pulseert de rand rood, in de laatste minuut tikt de klok */
  const krap=S.running&&!S.gm&&!S.ended&&l<300&&l>0;
  document.body.classList.toggle('krap',krap);
  if(krap&&l<60){const sec=Math.ceil(l);if(sec!==S.laatsteTik){S.laatsteTik=sec;geluid.tik();}}
  if(S.running&&!S.gm&&!S.ended){if(l<=0)gameOver();else radioCheck(l);}
}
function startClock(){if(S.running)return;S.start=Date.now();S.running=true;tick=setInterval(hud,500);bewaar();hud();}
function penalty(s){if(!S.gm)S.penalty+=s;bewaar();hud();}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* Doorzoeken: een gegeven (rij uit het dossier) is pas zichtbaar als een voorwerp het onthuld heeft */
function gevonden(id,rij){
  const P=PUZ[id];if(S.gm||S.solved[id]||!P||!P.voorwerpen)return true;
  const lijst=S.gevonden[id]||[];return P.voorwerpen.some(v=>lijst.includes(v.id)&&v.rijen.includes(rij));
}
function waarde(id,rij,tekst,leeg){return gevonden(id,rij)?tekst:(leeg||'?');}

/* Tekening in een kader; klikken vergroot ze */
function figBox(links,rechts,svg,id){
  return `<div class="fig zoomable" tabindex="0" role="button" aria-label="Tekening vergroten"${id?` id="${id}"`:''}><div class="cap"><span>${links}</span><span>${rechts?rechts+' · ':''}⤢ vergroot</span></div><div class="fig-svg">${svg}</div></div>`;
}
function openZoom(f){
  const svg=f.querySelector('svg');if(!svg)return;
  const cap=f.querySelector('.cap span');
  const o=document.createElement('div');o.className='zoom';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.innerHTML=`<div class="zoom-in"><div class="zoom-bar"><span>${cap?esc(cap.textContent):''}</span><button class="btn ghost" data-close>Sluiten ✕</button></div>${svg.outerHTML}</div>`;
  document.body.appendChild(o);
  const close=()=>{o.remove();document.removeEventListener('keydown',onKey);if(f.isConnected)f.focus();};
  const onKey=e=>{if(e.key==='Escape')close();};
  o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))close();});
  document.addEventListener('keydown',onKey);
  o.querySelector('[data-close]').focus();
}
document.addEventListener('click',e=>{const f=e.target.closest('.fig.zoomable');if(f&&!e.target.closest('[data-klik]'))openZoom(f);});   /* klikbare delen van een tekening openen geen vergroting */
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('zoomable')){e.preventDefault();openZoom(e.target);}});

/* =====================================================================
   TEKENINGEN
   ===================================================================== */
const MONO='font-family="IBM Plex Mono,monospace"';
/* Langsdoorsnede, schaal 9 px per meter. Draaischarnier op x=270. */
function elevation(o){
  o=o||{};const hl=o.hl||0,open=o.open||0;
  const top=(open>0||o.hoog)?-100:0;             /* open brugdek steekt hoger uit */
  /* proefopening (ruimte 3): windpijlen tegen het open brugdek en een melding linksboven */
  const extra=(o.wind?`<g stroke="#7fb0ff" stroke-width="3" fill="none">${[-50,-5,40].map(y=>`<path d="M180 ${y} h60"/><path d="M232 ${y-6} l8 6 l-8 6"/>`).join('')}</g><text x="180" y="-66" ${MONO} font-size="13" fill="#7fb0ff">wind (sluitend)</text>`:'')
    +(o.melding?`<text x="980" y="${top+28}" ${MONO} font-size="15" font-weight="600" fill="${o.kleur||'#f2a33a'}" text-anchor="end">${o.melding}</text>`:'');
  const a=open*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  const rot=(x,y)=>[270+x*c+y*s,190-x*s+y*c];    /* punt op de staartligger, meegedraaid */
  const [jx,jy]=rot(-27,6);                      /* aangrijpingspunt vijzel: t = 3,0 m */
  const tag=(n,x,y)=>{const done=S.solved[n],here=hl===n;return `<g><circle cx="${x}" cy="${y}" r="13" fill="${done?'#4cc38a':here?'#f2a33a':'#0a131b'}" stroke="#f2a33a" stroke-width="${here?4:2}"/><text x="${x}" y="${y+5}" ${MONO} font-size="14" font-weight="600" text-anchor="middle" fill="${done||here?'#0a131b':'#f2a33a'}">${n}</text></g>`;};
  return `<svg viewBox="0 ${top} 1000 ${340-top}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Langsdoorsnede van de fictieve Vaartdokbrug">
  <rect y="${top}" width="1000" height="${340-top}" fill="#0d1822"/>
  <rect x="280" y="232" width="250" height="108" fill="#173a52"/>
  ${Array.from({length:6},(_,i)=>`<path d="M${296+i*38} ${250+(i%2)*16} q10 -5 20 0" stroke="#2f6b8f" fill="none" stroke-width="1.5"/>`).join('')}
  <polygon points="0,200 150,200 150,340 0,340" fill="#3a4b5b"/>
  <polygon points="150,200 280,200 280,340 150,340" fill="#2c3b49"/>
  <rect x="164" y="202" width="110" height="124" fill="#0d1822" stroke="#3a4b5b" stroke-width="2"/>
  <rect x="0" y="182" width="270" height="16" fill="#7d93a8"/>
  <g><rect x="40" y="120" width="78" height="62" fill="#22384c" stroke="#5d7286"/><polygon points="34,122 79,96 124,122" fill="#2c4459" stroke="#5d7286"/><rect x="54" y="136" width="50" height="20" fill="#f2a33a" opacity=".8"/></g>
  <rect x="224" y="318" width="16" height="7" fill="#55687a"/>
  <line x1="232" y1="320" x2="${jx.toFixed(1)}" y2="${jy.toFixed(1)}" stroke="#c9d4dd" stroke-width="5" stroke-linecap="round"/>
  <g transform="rotate(${-open} 270 190)">
    <rect x="270" y="180" width="270" height="18" fill="#9fb3c6" stroke="#0a131b"/>
    <rect x="211.5" y="184" width="58.5" height="12" fill="#9fb3c6" stroke="#0a131b"/>
    <rect x="194" y="196" width="36" height="14" fill="#55687a" stroke="#0a131b"/>
  </g>

function animeer(dur,stap,klaar){
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();let af=false;
  const eind=()=>{if(af)return;af=true;stap(1);if(klaar)klaar();};
  if(reduce){eind();return;}
  const f=now=>{if(af)return;const p=Math.min(1,(now-t0)/dur);stap(p);if(p<1)requestAnimationFrame(f);else eind();};
  requestAnimationFrame(f);setTimeout(eind,dur+200);
}

    ${[['x','brugas'],['y','dwars'],['z','verticaal']].map(([a,n])=>`<span class="ax">${a}-as<small>${n}</small></span>${['r','t'].map(k=>a+'-'+k===VB18?`<div class="cel"><div class="vb" id="g-${a}-${k}">draaibrug<small>voorbeeld</small></div><div class="mini">${miniSVG('draaibrug','#4cc38a')}</div></div>`:`<div class="cel"><select id="g-${a}-${k}" aria-label="${a}-as, ${k==='r'?'rotatie om de as':'translatie volgens de as'}"><option value="">kies…</option>${OPTS18.map(o=>`<option>${o}</option>`).join('')}</select><div class="mini" id="mini-${a}-${k}" aria-live="polite"></div></div>`).join('')}`).join('')}</div>
    <p class="small muted">Voorbeeld: een draaibrug draait rond de verticale as, dus hoort ze bij z-as · rotatie. Na het bevestigen zie je in elk vakje hoe jouw keuze echt beweegt.</p>
    <div class="step">Stap 2 · Welk type is de Vaartdokbrug?</div>
    <label for="g-ons" class="small">Bekijk de langsdoorsnede bovenaan: hoe beweegt het brugdek, en waar zit het contragewicht?</label>
    <select id="g-ons"><option value="">kies…</option>${['kantelbrug','ophaalbrug','basculebrug','draaibrug','hefbrug','tafelbrug'].map(o=>`<option>${o}</option>`).join('')}</select>
    <button class="btn" id="try">Bevestig</button>`,
  check(){
    const keys=Object.keys(OK18).filter(k=>k!==VB18);
    if(keys.some(k=>!document.getElementById('g-'+k).value))return {leeg:true,t:'Vul eerst alle vakjes van de tabel in (stap 1).'};
    if(!document.getElementById('g-ons').value)return {leeg:true,t:'Kies ook het type van de Vaartdokbrug (stap 2).'};
    let n=0;for(const k of keys){if(OK18[k].includes(document.getElementById('g-'+k).value))n++;}
    const ons=document.getElementById('g-ons').value;
    if(n===keys.length&&ons==='basculebrug')return {ok:true};
    if(n===keys.length&&ons==='ophaalbrug')return {t:'De tabel klopt. Maar een ophaalbrug heeft een balans boven op een portaal. Bij deze brug zit het contragewicht aan de staartligger, in een kelder.'};
    if(n===keys.length)return {t:'De tabel klopt. Kijk nu naar de langsdoorsnede: hoe beweegt het brugdek, en waar zit het contragewicht?'};
    return {t:`${n} van de ${keys.length} vakjes in de tabel zijn juist. Bekijk in de rode vakjes hoe jouw keuze echt beweegt: draait het brugdek of schuift het, en rond of langs welke as?`};
  },
  naDuur:1400,
  init(){Object.keys(OK18).filter(k=>k!==VB18).forEach(k=>document.getElementById('g-'+k).addEventListener('change',tekenMinis));},
  na(){S.r1test={};Object.keys(OK18).filter(k=>k!==VB18).forEach(k=>{S.r1test[k]=document.getElementById('g-'+k).value;});tekenMinis();},
  cursus:'XVIII §1 (p. 208), tabel 18.1: beweegbare bruggen worden ingedeeld volgens de wijze van bewegen: rotatie om of translatie volgens de x-as (de brugas), de y-as (horizontaal, dwars op de brug) of de z-as (verticaal).',
  hints:['Een kantelbrug draait rond de brugas zelf. Een hefbrug gaat recht omhoog: volgens welke as? Een rolbrug schuift over de oever weg: volgens welke as? Een ophaalbrug klapt omhoog: rond welke as draait ze?','Het vakje zonder brugtype is translatie volgens de y-as. De Vaartdokbrug heeft een ballastkist aan een staartligger in een kelder: dat is een basculebrug (XVIII §3.2).'],
  kern:'Indeling van beweegbare bruggen volgens hun beweging (tabel 18.1). Een basculebrug roteert om de y-as.',
  uitleg:'Het systeem start op: "Type: basculebrug, rotatie om de y-as." Bij een basculebrug draait het beweegbare brugdek om een horizontale as dwars op de brug, en wordt het in evenwicht gehouden door een ballastkist aan het einde van de staartligger. Die ballastkist staat in de kelder, dus daar gaan jullie nu naartoe.'
},
2:{
  titel:'De ballastkist is leeggelopen',
  tekst:'Bij de laatste herstelling werd de ballastkist leeggemaakt. Naast de kist liggen betonblokken van 50 kN. Leg het juiste aantal blokken in de kist en test de balans: het brugdek moet uitgebalanceerd zijn zoals de cursus het voorschrijft voor een basculebrug. Elke mislukte test kost 1 minuut.',
  fig:()=>ballastSVG(),
  naDuur:900,
  voorwerpen:[
    {id:'logboek',icoon:'📒',naam:'Logboek van de brugwachter',rijen:[0,1,2],tekst:'12 maart: nieuwe slijtlaag gelegd, 230 kN. 3 april: leuningen, verlichting en slagboom vervangen, samen 120 kN. Volgens de fabrikant weegt het stalen brugdek zelf 1 500 kN.'},
    {id:'plan',icoon:'📐',naam:'Bouwplan aan de muur',rijen:[3,4,5],tekst:'Zwaartepunten gemeten vanaf het draaischarnier: stalen brugdek op 13,5 m, slijtlaag op 15,0 m, uitrusting op 15,5 m.'},
    {id:'plaatje',icoon:'🏷️',naam:'Plaatje op de ballastkist',rijen:[6,7],tekst:'Zwaartepunt van de ballastkist: 6,5 m achter het draaischarnier. Eigengewicht van staartligger en lege kist: verwaarloosbaar.'}
  ],
  dossier:[['Eigengewicht stalen brugdek G₁','1 500 kN'],['Slijtlaag G₂','230 kN'],['Leuningen, verlichting, slagboom G₃','120 kN'],['Arm G₁ tot draaischarnier','13,5 m'],['Arm G₂','15,0 m'],['Arm G₃','15,5 m'],['Arm ballastkist b','6,5 m'],['Staartligger en lege kist','verwaarloosd']],
  form:()=>`<div class="teller" role="group" aria-label="Blokken in de ballastkist">
      <button class="btn ghost" type="button" data-d="-10" aria-label="10 blokken eruit">−10</button><button class="btn ghost" type="button" data-d="-1" aria-label="1 blok eruit">−1</button>
      <input id="code" inputmode="numeric" maxlength="4" value="${S.r2n||0}" aria-label="Aantal blokken in de kist">
      <button class="btn ghost" type="button" data-d="1" aria-label="1 blok erbij">+1</button><button class="btn ghost" type="button" data-d="10" aria-label="10 blokken erbij">+10</button></div>
    <p class="small muted" id="r2info">${r2info()}</p>
    <button class="btn" id="try">Test de balans</button>`,
  init(){
    const inp=document.getElementById('code'),out=document.getElementById('out');
    const zet=v=>{v=Math.max(0,Math.min(150,Math.round(v)));S.r2n=v;S.r2ang=0;inp.value=v;document.getElementById('r2info').textContent=r2info();tekenRuimte();bewaar();};
    app.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{out.innerHTML='';zet((S.r2n||0)+(+b.dataset.d));}));
    inp.addEventListener('change',()=>{const v=num('code');if(isNaN(v))return zet(S.r2n||0);
      if(v>150){out.innerHTML=`<div class="msg info"><b>Let op</b>Dat lijkt een gewicht in kN. De kist telt blokken van 50 kN.</div>`;inp.value=S.r2n||0;return;}
      if(!Number.isInteger(v)){out.innerHTML=`<div class="msg info"><b>Let op</b>Je kan geen deel van een blok leggen. Rond af, maar naar welke kant?</div>`;inp.value=S.r2n||0;return;}
      out.innerHTML='';zet(v);});
  },
  check(){const v=num('code');
    if(isNaN(v)||v===0)return {leeg:true,t:'Leg eerst blokken in de kist.'};
    if(v>150)return {zacht:true,t:'Dat lijkt een gewicht in kN. De kist telt blokken van 50 kN.'};
    if(!Number.isInteger(v))return {zacht:true,t:'Je kan geen deel van een blok leggen. Rond af, maar naar welke kant?'};
    S.r2n=v;
    if(v===78)return {ok:true};
    if(v===79)return {t:'Het brugdek komt vanzelf omhoog: met 79 blokken weegt de ballast net te zwaar. Wat zegt de cursus over de zin van het resulterende moment?'};
    if(v>79)return {t:'Te zwaar: de ballast trekt het brugdek omhoog. Zo blijft de brug niet dicht liggen.'};
    if(v>=70)return {t:'Te licht: de neus van het brugdek drukt nog zwaar op de pijler. De vijzels zouden dat gewicht bij elke opening mee moeten heffen.'};
    return {t:'Veel te licht: het brugdek is nauwelijks uitgebalanceerd. Reken het evenwicht om het draaischarnier uit.'};},
  na(r){   /* na elke test: brugdek beweegt naar de stand die bij het aantal blokken hoort */
    S.r2test={n:S.r2n,ok:!!r.ok};
    const M=R2_MOMENT-R2_BLOK*R2_ARM*S.r2n;
    animeerKist(M>=0?0:Math.min(15,3+(-M)/50));
  },
  cursus:'XVIII §3.1–3.2 (p. 210–211): het brugdek wordt uitgebalanceerd door een ballastkist aan het einde van de staartligger, zodat G_dek·d ≈ G_ballast·b. Er moet steeds een zekere onbalans blijven: de ballastkist wordt zo uitgebalanceerd dat een licht sluitend resulterend moment ontstaat om het draaischarnier.',
  hints:['Σ G·d = 1 500·13,5 + 230·15,0 + 120·15,5. Deel door de arm b = 6,5 m en door 50 kN per blok.','Exact evenwicht vraagt 78,6 blokken. Rond je naar boven of naar beneden af als er een licht sluitend moment moet overblijven?'],
  kern:'Uitbalanceren van een basculebrug: G_dek·d ≈ G_ballast·b, met een licht sluitend resulterend moment.',
  uitleg:'Moment van het brugdek: 20 250 + 3 450 + 1 860 = 25 560 kNm. Exact evenwicht vraagt 25 560 / 6,5 = 3 932 kN, dus 78,6 blokken. Met 78 blokken (3 900 kN · 6,5 m = 25 350 kNm) blijft een licht sluitend resulterend moment van 210 kNm over. Zo zakt het brugdek vanzelf dicht als de aandrijving uitvalt, en gaat het niet open door trillingen of windzuiging. Onthoud die 210 kNm: de machinekamer heeft ze nodig.'
},
3:{
  titel:'De vijzels staan op de verkeerde druk',
  tekst:'De ballast is in orde. Nu moet de druk van de twee hydraulische vijzels ingesteld worden. Bereken de kracht die één vijzel moet kunnen leveren om het brugdek te openen tegen de wind in, stel ze in en doe een proefopening. Te weinig kracht en het brugdek blijft steken; te veel en het zwaait met een schok open.',
  naDuur:3000,
  fig:()=>S.r3view==='proef'?elevation({open:S.r3ang,hl:3,hoog:true,wind:true,zonderNummers:true,melding:S.r3msg&&S.r3msg.t,kleur:S.r3msg&&S.r3msg.k}):jackSVG(),
  voorwerpen:[
    {id:'voorschrift',icoon:'🌬️',naam:'Bedieningsvoorschrift',rijen:[1],tekst:'Openen toegestaan tot de bedieningswind. Windmoment op het open brugdek bij die wind: 1 290 kNm, in sluitende zin.'},
    {id:'typeplaat',icoon:'🏷️',naam:'Typeplaatje van de vijzel',rijen:[2,3,4],tekst:'Hydraulische vijzel, één per hoofdligger: 2 stuks. Aangrijpingspunt op t = 3,0 m van het draaischarnier. Wrijving in het scharnier: verwaarloosbaar.'},
    {id:'notitie',icoon:'📝',naam:'Notitie op het bureau',rijen:[0,5],tekst:'"Niet vergeten: het sluitend moment uit de kelder komt bij het windmoment. Tel beide volledig mee, dan zit je aan de veilige kant." (onderhoudsploeg)'}
  ],
  dossier:[['Sluitend resulterend moment (uit de kelder)','zelf invullen'],['Windmoment op het open brugdek (bedieningswind)','1 290 kNm'],['Arm vijzel tot draaischarnier t','3,0 m'],['Aantal vijzels (één per hoofdligger)','2'],['Wrijving in het draaischarnier','verwaarloosd'],['Aanname','beide momenten tellen volledig mee']],
  form:()=>`<label for="druk" class="small muted">Kracht per vijzel (schuif of typ)</label>
    <input type="range" id="druk" class="schuif" min="0" max="600" step="5" value="${S.r3T||0}" aria-label="Kracht per vijzel in kN">
    <div class="lock"><input id="code" inputmode="decimal" maxlength="6" placeholder="kN" value="${S.r3T||''}" aria-label="Kracht per vijzel in kN"><span class="eenheid">kN per vijzel</span></div>
    <button class="btn" id="try">Proefopening</button>`,
  init(){
    const sl=document.getElementById('druk'),inp=document.getElementById('code');
    const zet=v=>{S.r3T=v;S.r3view='jack';S.r3ang=0;S.r3msg=null;tekenRuimte(3);bewaar();};
    sl.addEventListener('input',()=>{inp.value=sl.value;zet(+sl.value);});
    inp.addEventListener('input',()=>{const v=num('code');if(!isNaN(v)&&v>=0&&v<=600){sl.value=v;zet(v);}});
  },
  check(){const v=num('code');
    if(isNaN(v)||v===0)return {leeg:true,t:'Stel eerst een kracht per vijzel in.'};
    if(Math.abs(v-250)<0.5)return {ok:true};
    if(Math.abs(v-500)<0.5)return {t:'Dat is de totale kracht. Er zijn twee vijzels.'};
    if([70,35].some(x=>Math.abs(v-x)<0.5))return {t:'Je vergeet de wind op het open brugdek.'};
    if([430,215].some(x=>Math.abs(v-x)<0.5))return {t:'Je gebruikt het windmoment, maar niet het sluitend resulterend moment uit de kelder.'};
    if([1500,750].some(x=>Math.abs(v-x)<0.5))return {t:'Je vergeet te delen door de arm t van de vijzel.'};
    if(v>250)return {t:'Overdruk: met die kracht zwaait het brugdek met een schok open en worden de hoofdliggers onnodig zwaar belast. Stel de kracht in die nodig is, niet meer.'};
    return {t:'Te weinig kracht: het brugdek blijft in de wind steken. Welke momenten moeten de vijzels samen overwinnen?'};},
  na(r){   /* proefopening in de langsdoorsnede; vereenvoudigd: het windmoment groeit lineair met de openingshoek */
    const T=num('code');S.r3T=T;S.r3view='proef';S.r3ang=0;S.r3msg={t:'proefopening …',k:'#f2a33a'};
    const stalt=Math.max(0,Math.min(75,75*(2*3*T-210)/1290));
    const naar=(van,tot,dur,klaar)=>animeer(dur,p=>{if(S.current!==3)return;S.r3ang=van+(tot-van)*zacht(p);tekenRuimte(3);},klaar);
    if(r.ok)naar(0,75,1800,()=>{S.r3msg={t:'✓ het brugdek opent volledig tegen de wind in',k:'#4cc38a'};tekenRuimte(3);});
    else if(T>250)naar(0,75,600,()=>{S.r3msg={t:'⚠ overdruk: het brugdek zwaait met een schok open',k:'#ef6b5b'};tekenRuimte(3);});
    else if(stalt<1){S.r3msg={t:'✗ het brugdek komt niet los',k:'#ef6b5b'};tekenRuimte(3);}
    else naar(0,stalt,1400,()=>{S.r3msg={t:`✗ blijft steken bij ${Math.round(stalt)}° en zakt terug`,k:'#ef6b5b'};tekenRuimte(3);setTimeout(()=>naar(stalt,0,1100),500);});
  },
  cursus:'XVIII §3.1 (p. 210): de nodige ophaalkracht is T = (G_dek·d − G_ballast·b) / t. Omdat er bewust een onbalans behouden blijft, wordt de ophaalkracht licht vergroot. §3.2 (p. 211): een basculebrug wordt geopend met hydraulische vijzels aan beide hoofdliggers.',
  hints:['De vijzels moeten twee sluitende momenten overwinnen: het sluitend resulterend moment uit de kelder en het windmoment op het open brugdek.','T_totaal = (210 + 1 290) / 3,0. Verdeel daarna over de vijzels.'],
  kern:'Ophaalkracht van de vijzels: T = (sluitend resulterend moment + windmoment) / t, verdeeld over de hoofdliggers.',
  uitleg:'T = (210 + 1 290) / 3,0 = 500 kN, dus 250 kN per vijzel. Het sluitend moment maakt de ophaalkracht iets groter, maar het is een veiligheid. In werkelijkheid verandert het moment van het eigengewicht met de openingshoek; hier tellen we het moment in gesloten stand en de wind op het open brugdek samen op, wat aan de veilige kant ligt. Het beweegbare brugdek is klaar. Nu naar de overkant van de doorvaart.'
},
4:{
  titel:'De vaste overspanning is losgeslagen',
  tekst:'Voor het beweegbare brugdek open mag, moet de vaste overspanning aan de noordkant veilig staan. Bij onderhoud werden de geleidingen van drie oplegtoestellen verwijderd. Oplegging A is volledig vast. Kies voor B, C en D welke beweging ze moeten verhinderen: klik in de tekening op een oplegging of kies hieronder. Test daarna wat er gebeurt op een warme zomerdag.',
  fig:()=>bearingSVG(),
  naDuur:1000,
  voorwerpen:[
    {id:'werkbon',icoon:'📋',naam:'Werkbon van het onderhoud',rijen:[0],tekst:'Geleidingen van de opleggingen B, C en D verwijderd voor inspectie. Oplegging A (pijler, west) is volledig vast blijven staan.'},
    {id:'plan',icoon:'📐',naam:'Plan van de vaste overspanning',rijen:[1],tekst:'Vaste overspanning: 40 m, stalen dek, van de pijler tot het noordlandhoofd.'},
    {id:'nota',icoon:'📘',naam:'Ontwerpnota',rijen:[2],tekst:'Het oplegschema moet de overspanning vrij laten uitzetten zonder parasitaire krachten, maar ze wel plaatsvast houden.'}
  ],
  dossier:[['A (pijler, west)','volledig vast'],['Overspanning','40 m, stalen dek'],['Doel','vrij uitzetten zonder parasitaire krachten, maar plaatsvast']],
  form:()=>`<div class="opl-grid">${['B','C','D'].map(k=>`<label for="b-${k}">Oplegging ${k}</label><select id="b-${k}"><option value="">kies…</option>${[['vast','volledig vast'],['langsvast','enkel vast in langse richting (beweegt dwars, y)'],['dwarsvast','enkel vast in dwarse richting (beweegt langs, x)'],['los','los (beweegt in alle richtingen)']].map(([v,t])=>`<option value="${v}"${S.r4&&S.r4[k]===v?' selected':''}>${t}</option>`).join('')}</select>`).join('')}</div>
    <button class="btn" id="try">Test bij +54 °C</button>`,
  init(){
    const zet=(k,v)=>{S.r4={...S.r4,[k]:v};document.getElementById('b-'+k).value=v;S.r4res=null;S.r4uitz=0;document.getElementById('out').innerHTML='';tekenRuimte(4);bewaar();};
    ['B','C','D'].forEach(k=>document.getElementById('b-'+k).addEventListener('change',e=>zet(k,e.target.value)));
    document.getElementById('roomfig').addEventListener('click',e=>{const g=e.target.closest('[data-opl]');if(!g||S.solved[4])return;const k=g.dataset.opl,nu=S.r4[k];zet(k,OPL_VOLGORDE[(OPL_VOLGORDE.indexOf(nu)+1)%OPL_VOLGORDE.length]);});
  },
  na(){   /* temperatuurtest: het dek zet uit vanaf A; wat klemt kleurt rood, wat te vrij staat oranje */
    S.r4res={};['B','C','D'].forEach(k=>S.r4res[k]=oplStatus(k,document.getElementById('b-'+k).value));
    animeer(900,p=>{if(S.current!==4)return;S.r4uitz=zacht(p);tekenRuimte(4);});
  },
  check(){const b=document.getElementById('b-B').value,c=document.getElementById('b-C').value,d=document.getElementById('b-D').value;
    if(!b||!c||!d)return {leeg:true,t:'Kies eerst voor elke oplegging een type.'};
    if(b==='langsvast'&&c==='dwarsvast'&&d==='los')return {ok:true};
    if([b,c,d].includes('vast'))return {t:'Er mag hooguit één volledig vaste oplegging zijn; anders ontstaan parasitaire krachten door temperatuur (XXIV §6).'};
    if(d!=='los')return {t:'Denk aan de oplegging die het verst van A ligt: in welke richtingen zet de brug daar uit?'};
    if(b==='dwarsvast'&&c==='langsvast')return {t:'Omgekeerd. B staat op dezelfde pijler als A: daar zet de brug enkel in de breedte uit. C ligt in lijn met A: daar zet de brug in de lengte uit.'};
    return {t:'De overspanning verschuift of klemt. Waar zet de brug uit, en waar moet ze geleid worden?'};},
  cursus:'XXIV §2 (p. 260): een oplegtoestel kan volledig vast zijn, enkel in langse of enkel in dwarse richting vast, of los. §6 (p. 265): om parasitaire krachten te voorkomen wordt hooguit één volledig vaste oplegging gebruikt. De andere opleggingen verhinderen enkel de bewegingen die nodig zijn om de brug stabiel te houden.',
  hints:['B staat op dezelfde pijler als A: de afstand tot A loopt dwars op de brug. C ligt op één lijn met A in de langsrichting. D ligt schuin tegenover A.','B: enkel vast in langse richting. C: enkel vast in dwarse richting. D: los.'],
  kern:'Oplegschema: hooguit één volledig vaste oplegging; de andere verhinderen enkel de bewegingen die nodig zijn voor de stabiliteit.',
  uitleg:'A is volledig vast. B staat op dezelfde pijler, dus de breedte van de brug moet er kunnen uitzetten: B is enkel vast in langse richting. C ligt in lijn met A en moet de lengteverandering over 40 m volgen, maar houdt de brug zijdelings op haar plaats: C is enkel vast in dwarse richting. D is los. A en B houden de brug samen in de langsrichting vast. Kanttekening: de cursus (XXIV §6, p. 265) plaatst de vaste oplegging bij voorkeur op een landhoofd, omdat een pijler met de vaste oplegging grote horizontale krachten krijgt. Hier is gekozen voor een compromis: met de vaste opleggingen op de pijler blijft de aansluiting met de punt van het beweegbare brugdek op haar plaats, en ligt de brugdekvoeg aan het landhoofd, weg van het beweegbare deel. De pijler moet daar dan wel op ontworpen zijn. Dat merken jullie in de volgende ruimte.'
},
5:{
  titel:'De remkracht moet ingegeven worden',
  tekst:'Het monitoringsysteem van de vaste overspanning vraagt de karakteristieke remkracht waarop de vaste opleggingen A en B en de pijler gecontroleerd worden. Reken beide delen van de formule uit hoofdstuk III uit, controleer de grenzen op de meter en laat een vrachtwagen remmen.',
  fig:()=>laneSVG(),
  naDuur:2400,
  voorwerpen:[

  cursus:'III §1.3 (p. 24–25): de remkracht Q_lk werkt als een langse kracht op de wegverharding. Q_lk = 1,2·Q₁k + 0,10·q₁k·w₁·L, met 180 kN ≤ Q_lk ≤ 800 kN. Daarin is w₁ de breedte van rijstrook 1 en L de lengte van het brugdek.',

6:{

/* =====================================================================

   ===================================================================== */
function groepTekst(){return `groep ${GROEP.nr}${GROEP.leden.length?' ('+GROEP.leden.join(', ')+')':''}`;}

function intro(){

  let hervatTekst='';
  if(lopend){const n=Object.keys(d.solved||{}).length,rest=TOTAL-((Date.now()-d.start)/1000+(d.penalty||0));
    hervatTekst=`<div class="resume"><div><b>Er loopt nog een spel.</b> ${n} van de 6 ruimtes opgelost${d.gm?' (spelleidermodus)':rest>0?`, nog ${fmt(rest)} op de klok`:', maar de tijd is intussen op'}.</div>
      <div class="row"><button class="btn" id="resume">Ga verder</button><button class="btn ghost" id="fresh">Opnieuw beginnen</button></div></div>`;}
  app.innerHTML=`<section class="panel stack hero">${hervatTekst}
    <div class="two">
      <div class="stack">
        <div class="eyebrow">Maandag · ${klok(START_KLOK)} · Vaartdok, haven van Gent</div>
        <h1>Een zeeschip wacht. De brug gaat niet open.</h1>
        <p>Na een stroompanne staat de Vaartdokbrug in storing en de brugwachter is onbereikbaar. Jullie zijn het ingenieursteam van wacht. Werk je van zuid naar noord door de brug, los in elke ruimte de storing op en open de brug voor het schip ertegen vaart.</p>
        <div class="radio">📻 Havenkapiteinsdienst: "Vaartdokbrug, de MV Schelde Trader vaart nu het dok in. Ze kan niet meer stoppen. U heeft ${minuten(TOTAL/60)} minuten. Over."</div>
        <div class="row"><button class="btn groot" id="go">▶ Start de klok (${TOTAL/60} minuten)</button>
          <label class="chk"><input type="checkbox" id="gm"> Spelleidermodus (geen klok, alle ruimtes open)</label></div>
        <div class="row hidden" id="demo"><button class="btn ghost" id="demo-lose">Voorbeeld: game over</button><button class="btn ghost" id="demo-win">Voorbeeld: gewonnen</button></div>
      </div>
      <div class="stack">
        ${figBox('Langsdoorsnede · zuid → noord','',elevation())}
        <div class="regels">
          <div><b>📘 Cursustip</b>In elke ruimte gratis</div>
          <div><b>💡 Extra hint</b>Kost 2 minuten</div>

        <p class="small muted">Klik op een tekening om ze te vergroten. Zet het geluid aan voor de radioberichten van het schip. Jullie voortgang wordt in deze browser bewaard. <a href="#over" data-about>Over dit spel</a></p>
      </div>
    </div>
    <div class="data"><div class="data-kop">De brug in cijfers</div><dl>${BRUG.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('')}</dl></div>
  </section>`;
  const gm=document.getElementById('gm');
  gm.addEventListener('change',()=>document.getElementById('demo').classList.toggle('hidden',!gm.checked));

  document.getElementById('go').addEventListener('click',()=>{S.gm=gm.checked;geluid.init();if(!S.gm){geluid.radio();setTimeout(()=>geluid.hoorn(0.15),450);startClock();}else hud();room(1);});
  if(lopend){
    document.getElementById('resume').addEventListener('click',()=>hervat(d));
    document.getElementById('fresh').addEventListener('click',()=>{wis();location.reload();});
  }

/* Een bewaard spel verderzetten; de klok liep intussen gewoon door */
function hervat(d){
  Object.assign(S,d);S.r2ang=0;
  geluid.init();
  if(S.running&&!S.gm){clearInterval(tick);tick=setInterval(hud,500);}
  hud();if(S.ended)return;
  if(S.scherm==='finale')finale();else room(S.current||1);
}

function about(){
  const terug=scherm;
  app.innerHTML=`<section class="panel stack">
    <div class="eyebrow">Over dit spel · ${VERSIE}</div>
    <h2>Escape room: De Vaartdokbrug zit vast</h2>
    <p>Item voor deel 2 van de opdracht Bruggenbouw 2026-2027, gemaakt door ${esc(groepTekst())}.${GROEP.nr==='XX'?' <span class="badge">groepsnummer en namen nog in te vullen</span>':''}</p>
